<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home / Nexus</title>
    
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12/dist/ext/ws.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/animations.css}" />
    <script th:src="@{/js/app.js}"></script>
    
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body class="bg-[#08080c] text-zinc-100 min-h-screen antialiased selection:bg-indigo-500 selection:text-white">
    
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col space-y-3 pointer-events-none max-w-sm w-full"></div>

    <div class="max-w-[1320px] mx-auto flex justify-center min-h-screen">

        <div th:replace="~{fragments/navigation :: left-nav(activeTab='home')}"></div>

        <main class="w-full max-w-[640px] flex-1 border-r border-zinc-800/80 min-h-screen bg-zinc-950/30"
              hx-ext="ws" 
              ws-connect="/ws/feed">
            
            <header class="sticky top-0 bg-[#08080c]/85 backdrop-blur-md border-b border-zinc-800/80 px-5 py-3.5 text-lg font-bold text-white z-20 flex justify-between items-center">
                <span>Home</span>
                <span class="text-[11px] px-2.5 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 font-semibold border border-indigo-500/20">Live</span>
            </header>

            <div id="compose-box" class="p-4 border-b border-zinc-800/80 flex space-x-3.5 bg-zinc-900/20">
                <div class="w-10 h-10 rounded-full border border-zinc-700/60 bg-indigo-600 overflow-hidden flex items-center justify-center font-bold text-white shrink-0 shadow-inner text-sm">
                    <img th:if="${currentUser?.avatarUrl != null}" th:src="${currentUser.avatarUrl}" class="w-full h-full object-cover" />
                    <span th:unless="${currentUser?.avatarUrl != null}" th:text="${currentUser != null ? currentUser.username.substring(0, 1).toUpperCase() : 'U'}">U</span>
                </div>

                <div class="flex-1 min-w-0">
                    <form hx-post="/tweets"
                          hx-encoding="multipart/form-data"
                          hx-target="#tweet-feed-list"
                          hx-swap="afterbegin"
                          hx-indicator="#compose-spinner"
                          hx-on::after-request="if(event.detail.successful) { this.reset(); clearImagePreview(); }"
                          class="space-y-3">
                        
                        <textarea name="content" maxlength="280" placeholder="What's happening in your network?" 
                                  class="w-full bg-transparent text-base text-zinc-100 placeholder-zinc-500 resize-none outline-none min-h-[4.5rem] focus:ring-0"></textarea>

                        <div id="image-preview-wrapper" class="relative hidden mb-3 rounded-2xl overflow-hidden border border-zinc-800 shadow-md">
                            <img id="image-preview" src="#" alt="Preview" class="max-h-72 w-full object-cover" />
                            <button type="button" onclick="clearImagePreview()" 
                                    class="absolute top-3 right-3 bg-black/75 hover:bg-black text-white rounded-full p-1.5 backdrop-blur transition">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                            </button>
                        </div>

                        <div class="flex justify-between items-center pt-3 border-t border-zinc-800/60">
                            <label class="cursor-pointer text-indigo-400 hover:bg-indigo-500/10 p-2 rounded-xl transition flex items-center group" title="Upload Media">
                                <input type="file" name="image" id="tweet-image-input" accept="image/*" class="hidden" onchange="previewSelectedImage(this)" />
                                <svg class="w-5 h-5 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                            </label>

                            <div class="flex items-center space-x-3">
                                <div id="compose-spinner" class="htmx-indicator flex items-center text-indigo-400">
                                    <svg class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>
                                </div>
                                <button type="submit" class="bg-gradient-to-r from-sky-500 via-indigo-500 to-purple-600 hover:opacity-90 text-white font-semibold px-4 py-1.5 rounded-full text-xs transition shadow-md shadow-indigo-500/20 active:scale-95">
                                    Post
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <div id="tweet-feed-list" class="divide-y divide-zinc-800/80">
                <th:block th:replace="~{fragments/tweet-feed :: tweet-list}"></th:block>
            </div>

            <div id="feed-spinner" class="htmx-indicator justify-center items-center p-6 space-x-2 text-indigo-500">
                <svg class="animate-spin h-5 w-5" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>
            </div>
        </main>

        <div th:replace="~{fragments/sidebar :: right-sidebar}"></div>
    </div>

    <div id="modal-container"></div>

    <script>
        function previewSelectedImage(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('image-preview').src = e.target.result;
                    document.getElementById('image-preview-wrapper').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }
        function clearImagePreview() {
            const input = document.getElementById('tweet-image-input');
            if (input) input.value = '';
            const preview = document.getElementById('image-preview');
            if (preview) preview.src = '#';
            const wrapper = document.getElementById('image-preview-wrapper');
            if (wrapper) wrapper.classList.add('hidden');
        }
    </script>
</body>
</html>
