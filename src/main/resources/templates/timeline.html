<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Home / ASMJ Biz Connect</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg(v=2)}" />
    <link rel="alternate icon" type="image/x-icon" th:href="@{/favicon.ico(v=2)}" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body class="bg-[#080c14] text-zinc-100 min-h-screen antialiased overflow-x-hidden select-none">

    <div class="max-w-[1400px] mx-auto flex justify-center min-h-screen">

        <!-- Responsive Navigation Header + Bottom Bar / Left Nav -->
        <div th:replace="~{fragments/navigation :: left-nav(activeTab='home')}"></div>

        <!-- Middle Column: Timeline Feed Workspace -->
        <main class="w-full md:max-w-2xl lg:max-w-2xl xl:max-w-3xl border-x border-zinc-800/80 min-h-screen pt-14 md:pt-0 pb-24">
            
            <!-- Sticky Feed Header -->
            <div class="sticky top-14 md:top-0 bg-[#080c14]/90 backdrop-blur-md border-b border-zinc-800/80 px-4 py-3 sm:px-6 sm:py-3.5 z-20 flex items-center justify-between">
                <h1 class="text-base sm:text-lg font-black text-white tracking-tight">Home Feed</h1>
                
                <!-- Refresh Feed Indicator -->
                <button type="button"
                        hx-get="/timeline/feed-fragment"
                        hx-target="#main-tweet-feed-container"
                        hx-swap="innerHTML"
                        class="p-1.5 rounded-full hover:bg-zinc-800/80 text-zinc-400 hover:text-sky-400 transition"
                        title="Refresh timeline">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                    </svg>
                </button>
            </div>

            <!-- Inline Post Composer (Desktop / Tablet) -->
            <div class="hidden sm:block p-4 border-b border-zinc-800/80 bg-zinc-950/20">
                <form hx-post="/timeline/tweets"
                      hx-encoding="multipart/form-data"
                      hx-target="#main-tweet-feed-container"
                      hx-swap="innerHTML"
                      hx-on::after-request="if(event.detail.successful) this.reset();"
                      class="space-y-3">
                    
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <div class="flex items-start space-x-3">
                        <div class="w-10 h-10 rounded-full bg-blue-600 border border-zinc-700/60 overflow-hidden flex items-center justify-center font-bold text-white text-xs shrink-0 shadow-inner">
                            <img th:if="${currentUser != null and currentUser.avatarUrl != null}" th:src="${currentUser.avatarUrl}" class="w-full h-full object-cover" />
                            <span th:unless="${currentUser != null and currentUser.avatarUrl != null}" th:text="${currentUser != null and currentUser.displayName != null and !currentUser.displayName.isEmpty() ? currentUser.displayName.substring(0, 1).toUpperCase() : 'U'}">U</span>
                        </div>

                        <div class="flex-1 min-w-0">
                            <textarea name="content" rows="3" required placeholder="What's happening in your business network?"
                                      class="w-full bg-transparent border-0 text-sm text-white placeholder-zinc-500 focus:outline-none focus:ring-0 resize-none p-1"></textarea>
                        </div>
                    </div>

                    <div class="flex items-center justify-between pt-2 border-t border-zinc-800/60">
                        <label class="cursor-pointer text-zinc-400 hover:text-white flex items-center space-x-1.5 text-xs p-1">
                            <svg class="w-5 h-5 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                            </svg>
                            <span>Add Photo / Media</span>
                            <input type="file" name="image" accept="image/*" class="hidden" />
                        </label>

                        <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-5 py-2 rounded-xl text-xs transition shadow-md shadow-blue-500/20 active:scale-95">
                            Post
                        </button>
                    </div>
                </form>
            </div>

            <!-- Feed Stream -->
            <div id="main-tweet-feed-container">
                <div th:replace="~{fragments/tweet-feed :: tweet-list}"></div>
            </div>

        </main>

        <!-- Right Sidebar (Events & Trends) -->
        <div th:replace="~{fragments/sidebar :: right-sidebar}"></div>

    </div>

</body>
</html>
