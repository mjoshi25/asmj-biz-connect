<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Home / ASMJ Biz Connect</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg(v=2)}" />
    <link rel="alternate icon" type="image/x-icon" th:href="@{/favicon.ico(v=2)}" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body class="bg-[#080c14] text-zinc-100 min-h-screen antialiased selection:bg-blue-500/30 selection:text-white">

    <div class="max-w-[1400px] mx-auto flex justify-center min-h-screen">
        
        <!-- Left Nav -->
        <div th:replace="~{fragments/navigation :: left-nav(activeTab='home')}"></div>

        <!-- Middle Column: Main Feed -->
        <main class="w-full md:max-w-2xl lg:max-w-2xl xl:max-w-2xl border-x border-zinc-800/80 min-h-screen pt-14 md:pt-0 pb-20 md:pb-12">
            
            <!-- Sticky Feed Header -->
            <div class="sticky top-14 md:top-0 bg-[#080c14]/90 backdrop-blur-md border-b border-zinc-800/80 px-4 py-3.5 z-20 flex items-center justify-between">
                <div>
                    <h1 class="text-base sm:text-lg font-bold text-white leading-none">Home</h1>
                    <span class="text-[11px] text-zinc-500 font-medium">B2B Enterprise Stream</span>
                </div>
                <div class="flex items-center space-x-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span class="text-[11px] text-zinc-400 font-medium">Live Feed</span>
                </div>
            </div>

            <!-- Feed Tabs (For You / Following) -->
            <div class="flex border-b border-zinc-800/80 text-xs font-bold text-center">
                <a th:href="@{/home(filter='for-you')}" 
                   class="flex-1 py-3 transition"
                   th:classappend="${activeFilter == null or activeFilter == 'for-you'} ? 'text-white border-b-2 border-blue-500' : 'text-zinc-500 hover:text-zinc-300'">
                    For You
                </a>
                <a th:href="@{/home(filter='following')}" 
                   class="flex-1 py-3 transition"
                   th:classappend="${activeFilter == 'following'} ? 'text-white border-b-2 border-blue-500' : 'text-zinc-500 hover:text-zinc-300'">
                    Following
                </a>
            </div>

            <!-- In-Feed Post Composer -->
            <div class="hidden sm:block p-4 border-b border-zinc-800/80 bg-zinc-950/40">
                <form th:action="@{/timeline/tweets}" method="post" enctype="multipart/form-data" class="space-y-3">
                    <div class="flex space-x-3">
                        <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-sky-500 to-indigo-600 overflow-hidden flex items-center justify-center font-bold text-white text-xs shrink-0 shadow-inner">
                            <img th:if="${currentUser != null and currentUser.avatarUrl != null}" th:src="${currentUser.avatarUrl}" class="w-full h-full object-cover" />
                            <span th:unless="${currentUser != null and currentUser.avatarUrl != null}" th:text="${currentUser != null && currentUser.displayName != null && !currentUser.displayName.isEmpty() ? currentUser.displayName.substring(0, 1).toUpperCase() : 'U'}">U</span>
                        </div>
                        <textarea name="content" rows="3" required placeholder="What's happening in your business network?" 
                                  class="flex-1 bg-transparent text-xs sm:text-sm text-white placeholder-zinc-500 focus:outline-none resize-none pt-2"></textarea>
                    </div>

                    <div class="flex items-center justify-between pt-2 border-t border-zinc-800/80">
                        <label class="cursor-pointer text-zinc-400 hover:text-white flex items-center space-x-1.5 text-xs transition">
                            <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                            </svg>
                            <span>Add Photo / Media</span>
                            <input type="file" name="image" accept="image/*" class="hidden" />
                        </label>

                        <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-5 py-2 rounded-full text-xs transition shadow-md shadow-blue-500/20 active:scale-95">
                            Post
                        </button>
                    </div>
                </form>
            </div>

            <!-- Feed List Fragment -->
            <div id="timeline-posts-container">
                <div th:replace="~{fragments/tweet-feed :: tweet-list}"></div>
            </div>

            <!-- Mobile Post Floating Button -->
            <div class="sm:hidden fixed bottom-20 right-4 z-30">
                <button type="button" 
                        onclick="document.getElementById('quick-post-modal').classList.remove('hidden')"
                        class="w-12 h-12 rounded-full bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center text-white shadow-xl shadow-blue-500/40 active:scale-95 transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
                    </svg>
                </button>
            </div>

        </main>

        <!-- Right Sidebar -->
        <div th:replace="~{fragments/sidebar :: right-sidebar}"></div>

    </div>

</body>
</html>
