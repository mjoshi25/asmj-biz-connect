<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <style type="text/css">
        @page { size: A4 portrait; margin: 12mm; }
        body { font-family: Helvetica, Arial, sans-serif; color: #334155; font-size: 9.5pt; margin: 0; padding: 0; }
        .sidebar { width: 32%; background-color: #0f172a; color: #f8fafc; padding: 14pt; vertical-align: top; }
        .main-content { width: 68%; padding: 14pt 16pt; vertical-align: top; }
        .name { font-size: 18pt; font-weight: bold; color: #fff; line-height: 1.1; margin-bottom: 8pt; }
        .passport-photo { width: 75pt; height: 95pt; border: 2pt solid #38bdf8; border-radius: 4pt; margin-bottom: 8pt; }
        .side-heading { font-size: 9pt; font-weight: bold; color: #38bdf8; text-transform: uppercase; margin-top: 12pt; margin-bottom: 4pt; border-bottom: 0.5pt solid #334155; padding-bottom: 2pt; }
        .side-text { font-size: 8pt; color: #cbd5e1; margin-bottom: 3pt; word-break: break-all; }
        .main-title { font-size: 12pt; font-weight: bold; color: #0f172a; text-transform: uppercase; border-bottom: 1.5pt solid #0284c7; padding-bottom: 2pt; margin-top: 10pt; margin-bottom: 6pt; }
        .item-role { font-weight: bold; color: #0f172a; font-size: 9.5pt; }
        .item-company { color: #0284c7; font-size: 8.5pt; font-weight: bold; }
        .item-date { text-align: right; color: #64748b; font-size: 8pt; }
        .item-desc { font-size: 8.5pt; color: #475569; margin-top: 2pt; margin-bottom: 6pt; }
    </style>
</head>
<body>
    <table width="100%" style="height: 100%; border-collapse: collapse;">
        <tr>
            <!-- Left Sidebar -->
            <td class="sidebar">
                <div th:if="${resume.photoBase64 != null}" style="text-align: center;">
                    <img th:src="${resume.photoBase64}" class="passport-photo" alt="Photo" />
                </div>
                <div class="name" th:text="${resume.fullName}">Alex Rivera</div>
                <div class="side-heading">Contact</div>
                <div class="side-text" th:text="${resume.email}">alex@example.com</div>
                <div class="side-text" th:text="${resume.phone}">+1 555-0199</div>
                <div class="side-text" th:text="${resume.location}">San Francisco, CA</div>

                <div class="side-heading" th:if="${!#lists.isEmpty(resume.skills)}">Skills</div>
                <div th:each="s : ${resume.skills}" class="side-text" th:text="'• ' + ${s}">Java</div>

                <div class="side-heading" th:if="${!#lists.isEmpty(resume.education)}">Education</div>
                <div th:each="edu : ${resume.education}" style="margin-bottom: 6pt;">
                    <div style="font-weight: bold; font-size: 8.5pt; color: #fff;" th:text="${edu.institution}">Univ</div>
                    <div class="side-text" th:text="${edu.degree}">Degree</div>
                    <div class="side-text" th:text="${edu.year}">Year</div>
                </div>
            </td>

            <!-- Main Content Area -->
            <td class="main-content">
                <div th:if="${resume.summary != null}" style="margin-bottom: 10pt;">
                    <div class="main-title">Profile</div>
                    <p class="item-desc" th:text="${resume.summary}"></p>
                </div>

                <div th:if="${!#lists.isEmpty(resume.experiences)}">
                    <div class="main-title">Experience</div>
                    <div th:each="exp : ${resume.experiences}">
                        <table width="100%">
                            <tr><td class="item-role" th:text="${exp.role}">Role</td><td class="item-date" th:text="${exp.duration}">Dates</td></tr>
                            <tr><td class="item-company" th:text="${exp.company}">Company</td><td></td></tr>
                        </table>
                        <p class="item-desc" th:text="${exp.description}"></p>
                    </div>
                </div>

                <div th:if="${!#lists.isEmpty(resume.projects)}">
                    <div class="main-title">Projects</div>
                    <div th:each="p : ${resume.projects}">
                        <div class="item-role" th:text="${p.title}">Project</div>
                        <p class="item-desc" th:text="${p.description}"></p>
                    </div>
                </div>
            </td>
        </tr>
    </table>
</body>
</html>
