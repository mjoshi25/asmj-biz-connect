<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ad Moderation / Nexus Admin</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link rel="stylesheet" th:href="@{/css/animations.css}" />
    <script th:src="@{/js/app.js}"></script>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body class="bg-[#08080c] text-zinc-100 min-h-screen antialiased">
    <div class="max-w-[1320px] mx-auto flex justify-center min-h-screen">
        
        <div th:replace="~{fragments/navigation :: left-nav(activeTab='admin-ads')}"></div>

        <main class="w-full max-w-[760px] flex-1 border-r border-zinc-800/80 min-h-screen pb-16 bg-zinc-950/30">
            <!-- Header -->
            <div class="sticky top-0 bg-[#08080c]/85 backdrop-blur-md border-b border-zinc-800/80 px-5 py-3.5 flex justify-between items-center z-20">
                <div>
                    <h1 class="text-lg font-bold text-white leading-none">Ad Approval Queue</h1>
                    <span class="text-[11px] text-zinc-500">Review and moderate advertiser submissions</span>
                </div>
                <span class="text-xs px-2.5 py-0.5 rounded-full bg-amber-500/10 text-amber-400 font-semibold border border-amber-500/20"
                      th:text="${pendingAds.size() + ' Pending'}">0 Pending</span>
            </div>

            <!-- Queue List -->
            <div class="divide-y divide-zinc-800/80 p-4 space-y-4">
                <div th:if="${#lists.isEmpty(pendingAds)}" class="p-16 text-center text-zinc-500 text-xs">
                    No campaigns awaiting review. All clear!
                </div>

                <div th:each="ad : ${pendingAds}" class="bg-zinc-900/40 rounded-2xl border border-zinc-800 p-5 space-y-4 shadow-sm">
                    
                    <!-- Advertiser Info & Actions -->
                    <div class="flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <div class="w-9 h-9 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-xs text-white"
                                 th:text="${ad.advertiserUsername.substring(0,1).toUpperCase()}">A</div>
                            <div>
                                <span class="font-bold text-xs text-white" th:text="${ad.advertiserDisplayName}">Name</span>
                                <span class="text-[11px] text-zinc-500 block leading-none" th:text="|@${ad.advertiserUsername}|">@handle</span>
                            </div>
                        </div>

                        <!-- One-click Chat with Advertiser (Admin -> Advertiser) -->
                        <a th:href="@{/messages(user=${ad.advertiserUsername})}"
                           class="text-xs text-indigo-400 hover:underline flex items-center space-x-1">
                            <span>Chat with Advertiser</span>
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
                        </a>
                    </div>

                    <!-- Creative Content -->
                    <div class="space-y-1.5">
                        <h2 class="text-sm font-bold text-white" th:text="${ad.title}">Ad Title</h2>
                        <p class="text-xs text-zinc-300" th:text="${ad.description}">Description</p>
                        <a th:href="${ad.targetUrl}" target="_blank" class="text-xs text-sky-400 hover:underline break-all block" th:text="${ad.targetUrl}">URL</a>
                    </div>

                    <!-- Media Asset Preview -->
                    <div th:if="${ad.mediaUrl != null}" class="rounded-xl overflow-hidden border border-zinc-800 max-h-60 bg-zinc-950">
                        <img th:src="${ad.mediaUrl}" alt="Media Asset" class="w-full h-full object-cover" />
                    </div>

                    <!-- Decision Controls Form -->
                    <form th:action="|/ads/admin/review/${ad.id}|" method="post" class="space-y-3 pt-3 border-t border-zinc-800/60">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                        <div>
                            <input type="text" name="feedback" placeholder="Optional feedback (e.g. Reason for rejection or guidance)"
                                   class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-indigo-500" />
                        </div>

                        <div class="flex items-center justify-end space-x-2">
                            <button type="submit" name="approve" value="false" 
                                    class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 px-4 py-1.5 rounded-full text-xs font-semibold transition">
                                Reject
                            </button>
                            <button type="submit" name="approve" value="true" 
                                    class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-1.5 rounded-full text-xs font-semibold transition shadow-md shadow-emerald-600/20">
                                Approve & Publish
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>

        <div th:replace="~{fragments/sidebar :: right-sidebar}"></div>
    </div>
</body>
</html>
