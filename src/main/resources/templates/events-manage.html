<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Events / ASMJ Biz Connect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body class="bg-[#080c14] text-zinc-100 min-h-screen antialiased p-4 sm:p-8">

    <div class="max-w-5xl mx-auto space-y-8">
        
        <!-- Header -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between border-b border-zinc-800 pb-4 gap-4">
            <div>
                <h1 class="text-xl sm:text-2xl font-black text-white tracking-tight">Manage Event Summits</h1>
                <p class="text-xs text-zinc-500">Post, edit, or track moderation status for your hosted events</p>
            </div>
            <div class="flex items-center gap-3">
                <a th:href="@{/events}" class="text-xs text-sky-400 hover:underline font-semibold">&larr; Back to Events Hub</a>
                <a th:href="@{/marketplace}" class="text-xs text-zinc-400 hover:text-white font-semibold">Platform Hub</a>
            </div>
        </div>

        <!-- Post New Event Form -->
        <div class="bg-zinc-900/60 border border-zinc-800 rounded-2xl p-6 space-y-4">
            <h2 class="text-sm font-bold text-white uppercase tracking-wider">Host a New Event Summit</h2>
            
            <form th:action="@{/events/post}" method="post" enctype="multipart/form-data" class="space-y-4">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[11px] font-bold text-zinc-400 uppercase mb-1">Event Title</label>
                        <input type="text" name="title" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-2.5 text-xs text-white focus:border-sky-500 focus:outline-none" placeholder="e.g., Tech Startup Mixer 2026"/>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-zinc-400 uppercase mb-1">Organization Name</label>
                        <input type="text" name="organizationName" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-2.5 text-xs text-white focus:border-sky-500 focus:outline-none" placeholder="e.g., ASMJ Ventures"/>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-[11px] font-bold text-zinc-400 uppercase mb-1">Event Type</label>
                        <input type="text" name="eventType" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-2.5 text-xs text-white focus:border-sky-500 focus:outline-none" placeholder="e.g., Conference"/>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-zinc-400 uppercase mb-1">City / Location</label>
                        <input type="text" name="city" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-2.5 text-xs text-white focus:border-sky-500 focus:outline-none" placeholder="e.g., Bengaluru"/>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-zinc-400 uppercase mb-1">Ticket Price (₹)</label>
                        <input type="number" step="0.01" name="ticketPrice" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-2.5 text-xs text-white focus:border-sky-500 focus:outline-none" placeholder="0.00"/>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[11px] font-bold text-zinc-400 uppercase mb-1">Event Date</label>
                        <input type="date" name="eventDate" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-2.5 text-xs text-white focus:border-sky-500 focus:outline-none"/>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-zinc-400 uppercase mb-1">Banner Image</label>
                        <input type="file" name="bannerFile" accept="image/*" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-2 text-xs text-zinc-400 file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-sky-600 file:text-white hover:file:bg-sky-500"/>
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-zinc-400 uppercase mb-1">Description</label>
                    <textarea name="description" rows="3" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-2.5 text-xs text-white focus:border-sky-500 focus:outline-none" placeholder="Provide event details, speakers, agenda..."></textarea>
                </div>

                <button type="submit" class="bg-sky-600 hover:bg-sky-500 text-white font-bold px-5 py-2.5 rounded-xl text-xs transition">
                    Publish Event Submission
                </button>
            </form>
        </div>

        <!-- My Hosted Events List -->
        <div class="space-y-4">
            <h2 class="text-sm font-bold text-white uppercase tracking-wider">Your Hosted Event Listings</h2>

            <div th:if="${myEvents == null || #lists.isEmpty(myEvents)}" class="p-6 text-center text-zinc-500 text-xs border border-zinc-900 rounded-2xl bg-zinc-950/40">
                You haven't posted any event summits yet.
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4" th:if="${myEvents != null && !#lists.isEmpty(myEvents)}">
                <div th:each="ev : ${myEvents}" class="bg-zinc-900/60 border border-zinc-800 rounded-2xl p-5 space-y-4 flex flex-col justify-between">
                    <div class="space-y-2">
                        <div class="flex justify-between items-start">
                            <span class="text-[10px] font-bold px-2.5 py-0.5 rounded-full border"
                                  th:classappend="${ev.status?.name() == 'APPROVED'} ? 'bg-emerald-950 text-emerald-400 border-emerald-800' : (${ev.status?.name() == 'REJECTED'} ? 'bg-red-950 text-red-400 border-red-800' : 'bg-amber-950 text-amber-400 border-amber-800')"
                                  th:text="${ev.status}">PENDING</span>
                            <span class="text-xs text-zinc-500" th:text="${ev.city}">City</span>
                        </div>
                        <h3 class="font-bold text-sm text-white" th:text="${ev.title}">Title</h3>
                        <p class="text-xs text-zinc-400 line-clamp-2" th:text="${ev.description}">Description</p>
                        
                        <!-- Rejection Reason Box if Rejected -->
                        <div th:if="${ev.status?.name() == 'REJECTED' && ev.rejectionReason != null}" class="text-xs text-red-300 bg-red-950/30 p-2.5 rounded-xl border border-red-900/50">
                            <span class="font-bold">Rejection Reason:</span> <span th:text="${ev.rejectionReason}">Reason</span>
                        </div>
                    </div>

                    <!-- Edit/Delete Action Forms -->
                    <div class="pt-3 border-t border-zinc-800 space-y-3">
                        <form th:action="@{/events/delete/{id}(id=${ev.id})}" method="post" class="flex gap-2">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <a th:href="@{/events/edit/{id}(id=${ev.id})}" class="flex-1 text-center bg-zinc-800 hover:bg-zinc-700 text-zinc-200 font-bold py-2 rounded-xl text-xs transition">
                                Edit
                            </a>
                            <button type="submit" onclick="return confirm('Delete this event?');" class="flex-1 bg-red-950/60 hover:bg-red-900 text-red-400 font-bold py-2 rounded-xl text-xs transition border border-red-800">
                                Delete
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
