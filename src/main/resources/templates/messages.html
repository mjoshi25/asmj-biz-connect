<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Messages & Groups / ASMJ Biz Connect</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg(v=2)}" />
    <link rel="alternate icon" type="image/x-icon" th:href="@{/favicon.ico(v=2)}" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body class="bg-[#080c14] text-zinc-100 min-h-screen antialiased overflow-x-hidden">

    <div class="max-w-[1400px] mx-auto flex justify-center min-h-screen">

        <!-- Responsive Navigation -->
        <div th:replace="~{fragments/navigation :: left-nav(activeTab='messages')}"></div>

        <!-- Middle Column: Conversations List (Hidden on mobile if a convo is open) -->
        <div class="w-full md:w-80 lg:w-96 border-r border-zinc-800/80 min-h-screen flex flex-col bg-zinc-950/40 pt-14 md:pt-0 pb-16 md:pb-0"
             th:classappend="${activeConvoId != null} ? 'hidden md:flex' : 'flex'">
            
            <!-- Messages Header -->
            <div class="h-14 md:h-16 px-4 border-b border-zinc-800/80 flex items-center justify-between bg-[#080c14]/90 backdrop-blur-md sticky top-14 md:top-0 z-20">
                <h1 class="text-base sm:text-lg font-bold text-white leading-none">Messages</h1>
                
                <div class="flex items-center space-x-2">
                    <!-- + New Chat / Group Action Trigger -->
                    <button type="button" 
                            onclick="openChatCreationModal()"
                            class="px-3 py-1.5 rounded-full bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs transition shadow-md shadow-blue-500/20 active:scale-95 flex items-center space-x-1.5"
                            title="New Chat or Group">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
                        </svg>
                        <span>New Chat</span>
                    </button>
                </div>
            </div>

            <!-- Conversations List -->
            <div class="flex-1 overflow-y-auto divide-y divide-zinc-800/40">
                <div th:if="${#lists.isEmpty(conversations)}" class="p-8 text-center text-xs text-zinc-500 space-y-2">
                    <p>No active conversations yet.</p>
                    <button type="button" onclick="openChatCreationModal()" class="text-sky-400 hover:underline font-semibold">
                        Click here to start a 1:1 or group chat
                    </button>
                </div>

                <a th:each="convo : ${conversations}"
                   th:href="|/messages?convo=${convo.conversationId}|"
                   th:classappend="${activeConvoId == convo.conversationId} ? 'bg-zinc-800/60 border-l-2 border-blue-500' : 'hover:bg-zinc-900/50'"
                   class="p-3.5 sm:p-4 flex items-center space-x-3 transition cursor-pointer group block">
                    
                    <div class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-white text-xs shrink-0 shadow-inner"
                         th:classappend="${convo.isGroup} ? 'bg-gradient-to-tr from-indigo-500 to-purple-600' : 'bg-gradient-to-tr from-sky-500 to-indigo-600'">
                        <span th:text="${convo.defaultInitial}">U</span>
                    </div>

                    <div class="flex-1 min-w-0">
                        <div class="flex items-center justify-between mb-0.5">
                            <div class="flex items-center space-x-1.5 min-w-0">
                                <span class="font-bold text-xs text-white truncate" th:text="${convo.title}">User</span>
                                <span th:if="${convo.isGroup}" class="text-[9px] bg-purple-500/20 border border-purple-500/40 text-purple-300 px-1 rounded uppercase font-semibold">Group</span>
                            </div>
                            <span class="text-[10px] text-zinc-500 shrink-0" th:text="${convo.lastMessageTimeFormatted}">Time</span>
                        </div>
                        <p class="text-xs text-zinc-400 truncate" th:text="${convo.lastMessage}">Preview...</p>
                    </div>
                </a>
            </div>
        </div>

        <!-- Right Column: Active Chat Panel (Full width on mobile when convo is open) -->
        <main id="chat-panel" 
              class="w-full md:flex-1 flex flex-col min-h-screen bg-[#080c14] pt-14 md:pt-0 pb-16 md:pb-0"
              th:classappend="${activeConvoId == null} ? 'hidden md:flex' : 'flex'">
            
            <!-- Mobile Top Return Bar -->
            <div th:if="${activeConvoId != null}" class="md:hidden h-12 bg-zinc-950 border-b border-zinc-800 px-3 flex items-center justify-between shrink-0 sticky top-14 z-20">
                <a th:href="@{/messages}" class="text-xs font-bold text-sky-400 flex items-center space-x-1 py-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/></svg>
                    <span>Back to Chats</span>
                </a>
                <span th:if="${activeConversation != null}" class="text-xs font-bold text-white truncate max-w-[180px]" th:text="${activeConversation.name != null ? activeConversation.name : 'Direct Chat'}">Chat</span>
            </div>

            <div th:replace="~{fragments/message-panel :: chat-window}"></div>
        </main>
    </div>

    <!-- MODAL: Unified Chat / Group Creation with Search & Participant List -->
    <div id="new-convo-modal" class="hidden fixed inset-0 z-[100] flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/80 backdrop-blur-sm animate-fadeIn">
        <div class="bg-zinc-950 border border-zinc-800 rounded-t-3xl sm:rounded-3xl max-w-lg w-full p-5 sm:p-6 shadow-2xl space-y-4 max-h-[85vh] overflow-y-auto">
            
            <!-- Tabs -->
            <div class="flex items-center justify-between border-b border-zinc-800 pb-3">
                <div class="flex space-x-4">
                    <button type="button" id="tab-direct-btn" onclick="switchModalTab('direct')" class="text-xs font-bold text-white pb-1 border-b-2 border-blue-500">1:1 Direct Chat</button>
                    <button type="button" id="tab-group-btn" onclick="switchModalTab('group')" class="text-xs font-bold text-zinc-400 hover:text-white pb-1">Create Group</button>
                </div>
                <button type="button" onclick="document.getElementById('new-convo-modal').classList.add('hidden')" class="text-zinc-500 hover:text-white p-1 text-lg">&times;</button>
            </div>

            <!-- TAB 1: Direct 1:1 Chat Selection with Search -->
            <div id="direct-chat-section" class="space-y-3">
                <input type="text" id="direct-user-search" oninput="filterDirectUsers()" placeholder="Search contact by name or @username..."
                       class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3.5 py-2 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-blue-500" />
                
                <div class="max-h-60 overflow-y-auto divide-y divide-zinc-800/60 border border-zinc-800 rounded-2xl bg-zinc-900/50" id="direct-users-list">
                    <form th:each="u : ${availableUsers}" th:action="@{/messages/direct/start}" method="post" class="direct-user-item p-3 hover:bg-zinc-800/60 flex items-center justify-between transition cursor-pointer" onclick="this.submit()">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <input type="hidden" name="recipient" th:value="${u.username}" />
                        
                        <div class="flex items-center space-x-3 min-w-0">
                            <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center font-bold text-white text-xs shrink-0 shadow-inner">
                                <span th:text="${u.displayName != null && !u.displayName.isEmpty() ? u.displayName.substring(0, 1).toUpperCase() : 'U'}">U</span>
                            </div>
                            <div class="min-w-0">
                                <span class="font-bold text-xs text-white block truncate user-name" th:text="${u.displayName}">Name</span>
                                <span class="text-[11px] text-zinc-500 block truncate user-handle" th:text="|@${u.username}|">@handle</span>
                            </div>
                        </div>

                        <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-3 py-1 rounded-full text-[11px] transition shadow-sm">
                            Message
                        </button>
                    </form>
                </div>
            </div>

            <!-- TAB 2: Group Chat Creation with Participant Checklist -->
            <form id="group-chat-form" th:action="@{/messages/group/create}" method="post" class="hidden space-y-4">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div>
                    <label class="block text-xs font-semibold text-zinc-300 mb-1">Group Name</label>
                    <input type="text" name="groupName" required placeholder="e.g. Executive Strategy, Project Fleet"
                           class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-purple-500" />
                </div>

                <div>
                    <label class="block text-xs font-semibold text-zinc-300 mb-1">Select Participants (Check all that apply)</label>
                    <div class="max-h-52 overflow-y-auto space-y-1.5 p-2.5 bg-zinc-900 border border-zinc-800 rounded-xl">
                        <label th:each="user : ${availableUsers}" class="flex items-center space-x-2.5 p-2 hover:bg-zinc-800/60 rounded-xl cursor-pointer text-xs text-zinc-300 transition">
                            <input type="checkbox" name="memberUsernames" th:value="${user.username}" class="w-4 h-4 rounded bg-zinc-950 border-zinc-700 text-purple-600 focus:ring-0" />
                            <div class="flex-1 min-w-0">
                                <span class="font-bold text-white block truncate" th:text="${user.displayName}">Name</span>
                                <span class="text-zinc-500 text-[11px] block truncate" th:text="|@${user.username}|">@handle</span>
                            </div>
                        </label>
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-2.5 rounded-xl text-xs transition active:scale-95 shadow-md">
                        Create Group & Open Room
                    </button>
                </div>
            </form>

        </div>
    </div>

    <!-- MODAL: Group Settings / Add Members & Exit (Rendered if in active group chat) -->
    <div id="group-manage-modal" th:if="${activeConversation != null and activeConversation.isGroup}" class="hidden fixed inset-0 z-[100] flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/80 backdrop-blur-sm animate-fadeIn">
        <div class="bg-zinc-950 border border-zinc-800 rounded-t-3xl sm:rounded-3xl max-w-md w-full p-5 sm:p-6 shadow-2xl space-y-4 max-h-[85vh] overflow-y-auto">
            
            <div class="flex items-center justify-between border-b border-zinc-800 pb-3">
                <h3 class="font-bold text-sm text-white" th:text="${activeConversation.name}">Group Info</h3>
                <button type="button" onclick="document.getElementById('group-manage-modal').classList.add('hidden')" class="text-zinc-500 hover:text-white p-1 text-lg">&times;</button>
            </div>

            <!-- Current Members List -->
            <div class="space-y-2">
                <label class="block text-xs font-semibold text-zinc-400">Current Participants (<span th:text="${activeConversation.participantUsernames.size()}">0</span>)</label>
                <div class="max-h-36 overflow-y-auto space-y-1 p-2 bg-zinc-900 rounded-xl text-xs">
                    <div th:each="username : ${activeConversation.participantUsernames}" class="flex items-center justify-between p-1.5 text-zinc-300">
                        <span th:text="|@${username}|">@user</span>
                        <span th:if="${username.equalsIgnoreCase(currentUser.username)}" class="text-[10px] text-sky-400 font-bold bg-sky-500/10 px-1.5 py-0.5 rounded">You</span>
                    </div>
                </div>
            </div>

            <!-- Add Members Form -->
            <form th:action="|/messages/group/${activeConversation.id}/add-members|" method="post" class="space-y-3 pt-2 border-t border-zinc-800">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <label class="block text-xs font-semibold text-zinc-300">Add New Members</label>
                <div class="max-h-32 overflow-y-auto space-y-1 p-2 bg-zinc-900 border border-zinc-800 rounded-xl">
                    <label th:each="user : ${availableUsers}" 
                           th:unless="${activeConversation.participantUsernames.contains(user.username.toLowerCase())}"
                           class="flex items-center space-x-2 p-1.5 hover:bg-zinc-800 rounded-lg cursor-pointer text-xs text-zinc-300">
                        <input type="checkbox" name="memberUsernames" th:value="${user.username}" class="w-3.5 h-3.5 rounded bg-zinc-950 border-zinc-700 text-purple-600 focus:ring-0" />
                        <span th:text="|${user.displayName} (@${user.username})|">User</span>
                    </label>
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 rounded-xl text-xs transition">Add Selected Users</button>
            </form>

            <!-- Exit Group Button -->
            <form th:action="|/messages/group/${activeConversation.id}/exit|" method="post" class="pt-2 border-t border-zinc-800">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="w-full bg-rose-600/10 border border-rose-500/30 hover:bg-rose-600/20 text-rose-400 font-bold py-2 rounded-xl text-xs transition">
                    Exit Group
                </button>
            </form>

        </div>
    </div>

    <script>
        function openChatCreationModal() {
            document.getElementById('new-convo-modal').classList.remove('hidden');
            switchModalTab('direct');
        }

        function switchModalTab(tab) {
            const directSec = document.getElementById('direct-chat-section');
            const groupForm = document.getElementById('group-chat-form');
            const directBtn = document.getElementById('tab-direct-btn');
            const groupBtn = document.getElementById('tab-group-btn');

            if (tab === 'group') {
                directSec.classList.add('hidden');
                groupForm.classList.remove('hidden');
                groupBtn.className = "text-xs font-bold text-white pb-1 border-b-2 border-purple-500";
                directBtn.className = "text-xs font-bold text-zinc-400 hover:text-white pb-1";
            } else {
                groupForm.classList.add('hidden');
                directSec.classList.remove('hidden');
                directBtn.className = "text-xs font-bold text-white pb-1 border-b-2 border-blue-500";
                groupBtn.className = "text-xs font-bold text-zinc-400 hover:text-white pb-1";
            }
        }

        function filterDirectUsers() {
            const query = document.getElementById('direct-user-search').value.toLowerCase();
            const items = document.querySelectorAll('.direct-user-item');
            items.forEach(item => {
                const name = item.querySelector('.user-name').innerText.toLowerCase();
                const handle = item.querySelector('.user-handle').innerText.toLowerCase();
                if (name.includes(query) || handle.includes(query)) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        function scrollMessageFeedToBottom() {
            const feed = document.getElementById('message-feed');
            if (feed) feed.scrollTop = feed.scrollHeight;
        }
        document.addEventListener("DOMContentLoaded", scrollMessageFeedToBottom);
        document.body.addEventListener('htmx:afterSwap', scrollMessageFeedToBottom);
    </script>
</body>
</html>
