<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="tweet-list" class="divide-y divide-zinc-800/60">
    
    <div th:if="${#lists.isEmpty(tweets)}" class="p-12 text-center text-zinc-500 text-xs">
        <p class="font-semibold text-zinc-400 text-sm mb-1">No posts yet</p>
        <p>Publish your first business update or commercial listing using the composer above!</p>
    </div>

    <article th:each="tweet : ${tweets}" class="p-4 sm:p-5 hover:bg-zinc-900/30 transition flex space-x-3 group">
        
        <!-- Author Avatar -->
        <a th:href="|/u/${tweet.authorUsername}|" class="w-10 h-10 rounded-full bg-blue-600 border border-zinc-700/60 overflow-hidden flex items-center justify-center font-bold text-white text-xs shrink-0 shadow-inner">
            <img th:if="${tweet.authorAvatarUrl != null}" th:src="${tweet.authorAvatarUrl}" class="w-full h-full object-cover" />
            <span th:unless="${tweet.authorAvatarUrl != null}" th:text="${tweet.authorDisplayName != null and !tweet.authorDisplayName.isEmpty() ? tweet.authorDisplayName.substring(0, 1).toUpperCase() : 'U'}">U</span>
        </a>

        <!-- Content Body -->
        <div class="flex-1 min-w-0 space-y-2">
            
            <div class="flex items-center space-x-1.5 text-xs">
                <a th:href="|/u/${tweet.authorUsername}|" class="font-bold text-white hover:underline truncate" th:text="${tweet.authorDisplayName}">User Name</a>
                <span class="text-zinc-500 truncate" th:text="|@${tweet.authorUsername}|">@handle</span>
                <span class="text-zinc-600">·</span>
                <span class="text-zinc-500 text-[11px] shrink-0" th:text="${tweet.formattedDate}">Time</span>
            </div>

            <p class="text-xs sm:text-[13px] text-zinc-200 leading-relaxed break-words whitespace-pre-line" th:text="${tweet.content}">Post text content...</p>

            <!-- Media Image Preview -->
            <div th:if="${tweet.mediaUrl != null and !tweet.mediaUrl.isEmpty()}" class="rounded-2xl overflow-hidden border border-zinc-800 mt-2 max-h-96 bg-zinc-950">
                <img th:src="${tweet.mediaUrl}" class="w-full h-full object-cover" loading="lazy" />
            </div>

            <!-- Action Ribbon (Like, Reply, Chat) -->
            <div class="flex items-center justify-between pt-2 text-zinc-500 text-xs max-w-md">
                
                <!-- Like Button -->
                <button type="button"
                        th:data-tweet-id="${tweet.id}"
                        onclick="toggleLikePost(this)"
                        class="flex items-center space-x-1.5 hover:text-rose-500 transition group/btn">
                    <svg class="w-4 h-4 group-hover/btn:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
                    </svg>
                    <span class="like-count font-semibold text-[11px]" th:text="${tweet.likesCount}">0</span>
                </button>

                <!-- Reply Link -->
                <a th:href="|/tweets/${tweet.id}|" class="flex items-center space-x-1.5 hover:text-sky-400 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                    </svg>
                    <span class="font-semibold text-[11px]" th:text="${tweet.repliesCount}">0</span>
                </a>

                <!-- Start Chat with Author -->
                <form th:action="@{/messages/direct/start}" method="post" class="inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <input type="hidden" name="recipient" th:value="${tweet.authorUsername}" />
                    <button type="submit" class="hover:text-sky-400 transition flex items-center space-x-1 text-[11px]" title="Direct Message">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                        </svg>
                        <span class="hidden sm:inline">Message</span>
                    </button>
                </form>

            </div>

        </div>

    </article>

    <script>
        function toggleLikePost(btn) {
            const tweetId = btn.getAttribute('data-tweet-id');
            const token = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
            const header = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content');

            fetch('/tweets/' + tweetId + '/like', {
                method: 'POST',
                headers: {
                    [header]: token,
                    'Content-Type': 'application/x-www-form-urlencoded'
                }
            })
            .then(res => res.text())
            .then(count => {
                const counter = btn.querySelector('.like-count');
                if (counter) counter.innerText = count;
                btn.classList.add('text-rose-500');
            })
            .catch(err => console.error('Like error:', err));
        }
    </script>
</div>

</body>
</html>
