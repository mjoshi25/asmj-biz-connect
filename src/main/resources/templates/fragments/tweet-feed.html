<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<div th:fragment="tweet-list">
    <div th:if="${#lists.isEmpty(tweets)}" class="p-16 text-center text-zinc-500 text-xs">
        No posts yet. Be the first to share an update on ASMJ Biz Connect!
    </div>

    <article th:each="tweet : ${tweets}" 
             th:id="|tweet-${tweet.id}|" 
             class="p-4 hover:bg-zinc-900/40 transition border-b border-zinc-800/80 flex space-x-3.5 animate-fadeIn">
        
        <!-- Author Avatar -->
        <a th:href="|/u/${tweet.authorUsername}|" class="shrink-0">
            <div class="w-10 h-10 rounded-full border border-zinc-700/60 bg-blue-600 overflow-hidden flex items-center justify-center font-bold text-white shadow-inner text-xs">
                <span th:text="${tweet.authorDisplayName != null && !tweet.authorDisplayName.isEmpty() ? tweet.authorDisplayName.substring(0, 1).toUpperCase() : 'U'}">U</span>
            </div>
        </a>

        <!-- Content Area -->
        <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-1.5 min-w-0">
                    <a th:href="|/u/${tweet.authorUsername}|" class="font-bold text-xs text-white hover:text-sky-400 truncate transition" th:text="${tweet.authorDisplayName}">Name</a>
                    <span class="text-[11px] text-zinc-500 truncate" th:text="|@${tweet.authorUsername}|">@handle</span>
                    <span class="text-[11px] text-zinc-600">·</span>
                    <span class="text-[11px] text-zinc-500 shrink-0" th:text="${#temporals.format(tweet.createdAt, 'MMM d')}">Date</span>
                </div>

                <!-- Delete Option (Author or Admin) -->
                <button th:if="${currentUser != null and (currentUser.username == tweet.authorUsername or #authorization.expression('hasRole(''ADMIN'')'))}"
                        type="button"
                        th:hx-delete="|/timeline/tweets/${tweet.id}|"
                        hx-target="closest article"
                        hx-swap="outerHTML swap:300ms"
                        hx-confirm="Are you sure you want to delete this post?"
                        class="text-zinc-500 hover:text-rose-400 p-1.5 rounded-full hover:bg-rose-500/10 transition"
                        title="Delete Post">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                    </svg>
                </button>
            </div>

            <!-- Post Body -->
            <p class="text-xs text-zinc-200 mt-1 leading-relaxed break-words" th:text="${tweet.content}">Post text</p>

            <!-- Media Preview -->
            <div th:if="${tweet.imageUrl != null}" class="mt-2.5 rounded-2xl overflow-hidden border border-zinc-800 bg-zinc-950 max-h-80">
                <img th:src="${tweet.imageUrl}" alt="Attachment" class="w-full h-full object-cover" />
            </div>

            <!-- Action Controls (Reply, Like) -->
            <div class="flex items-center space-x-6 mt-3 text-zinc-500 text-xs">
                <!-- Thread Link -->
                <a th:href="|/tweets/${tweet.id}/thread|" class="flex items-center space-x-1.5 hover:text-sky-400 transition group">
                    <svg class="w-4 h-4 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                    </svg>
                    <span th:text="${tweet.repliesCount}">0</span>
                </a>

                <!-- Like Action -->
                <button type="button" 
                        th:hx-post="|/timeline/tweets/${tweet.id}/like|"
                        hx-swap="outerHTML"
                        class="flex items-center space-x-1.5 hover:text-rose-400 transition group">
                    <svg class="w-4 h-4 group-hover:scale-110 transition-transform" 
                         th:classappend="${currentUser != null and tweet.likedByUsernames != null and tweet.likedByUsernames.contains(currentUser.username)} ? 'fill-rose-500 text-rose-500' : 'fill-none stroke-current'" 
                         viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
                    </svg>
                    <span th:text="${tweet.likesCount}">0</span>
                </button>
            </div>
        </div>
    </article>
</div>

</body>
</html>
