<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<aside th:fragment="right-sidebar" class="w-[340px] hidden lg:block p-4 space-y-4 shrink-0">
    
    <!-- Search Bar -->
    <div class="relative" id="search-box-container">
        <div class="relative flex items-center">
            <svg class="w-4 h-4 text-zinc-500 absolute left-4 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <input type="search" 
                   name="q"
                   placeholder="Search" 
                   autocomplete="off"
                   hx-get="/search/autocomplete"
                   hx-trigger="input changed delay:250ms, search"
                   hx-target="#search-results-dropdown"
                   hx-indicator="#search-spinner"
                   class="w-full bg-zinc-900/70 border border-zinc-800/80 focus:border-sky-500/60 focus:bg-zinc-900/90 rounded-2xl py-2.5 pl-11 pr-10 text-xs text-white placeholder-zinc-500 outline-none transition duration-200" />
            
            <div id="search-spinner" class="htmx-indicator absolute right-3 text-sky-500">
                <svg class="animate-spin h-3.5 w-3.5" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                </svg>
            </div>
        </div>
        <div id="search-results-dropdown" class="absolute top-12 left-0 right-0 z-50"></div>
    </div>

    <!-- Who to Follow -->
    <div th:if="${suggestedUsers != null and !#lists.isEmpty(suggestedUsers)}" 
         class="bg-zinc-900/40 rounded-3xl border border-zinc-800/70 p-4 shadow-sm backdrop-blur-sm">
        <h3 class="font-bold text-sm text-zinc-100 mb-3 px-1">Who to follow</h3>
        <div class="space-y-3">
            <div th:each="user : ${suggestedUsers}" class="flex items-center justify-between group">
                <a th:href="|/u/${user.username}|" class="flex items-center space-x-3 min-w-0 flex-1 hover:opacity-90 transition">
                    <div class="w-9 h-9 rounded-full bg-sky-600 border border-zinc-700/60 flex items-center justify-center font-bold text-xs text-white shrink-0 overflow-hidden shadow-inner">
                        <img th:if="${user.avatarUrl != null}" th:src="${user.avatarUrl}" class="w-full h-full object-cover" />
                        <span th:unless="${user.avatarUrl != null}" th:text="${user.username.substring(0, 1).toUpperCase()}">U</span>
                    </div>
                    <div class="min-w-0">
                        <p class="font-bold text-xs text-zinc-100 truncate group-hover:text-sky-400 transition" th:text="${user.displayName}">Name</p>
                        <span class="text-[11px] text-zinc-500 truncate block" th:text="|@${user.username}|">@handle</span>
                    </div>
                </a>

                <a th:href="|/u/${user.username}|" class="bg-zinc-100 hover:bg-white text-zinc-900 font-bold px-3.5 py-1.5 rounded-full text-xs transition shadow-sm">
                    View
                </a>
            </div>
        </div>
    </div>

    <!-- Trending Tags -->
    <div class="bg-zinc-900/40 rounded-3xl border border-zinc-800/70 p-4 shadow-sm backdrop-blur-sm">
        <h3 class="font-bold text-sm text-zinc-100 mb-3 px-1">Trends for you</h3>
        <div class="space-y-3">
            <div th:if="${#lists.isEmpty(trending)}" class="text-xs text-zinc-500 px-1">No trends right now.</div>
            <div th:each="trend : ${trending}" class="flex flex-col group px-1">
                <span class="text-[10px] text-zinc-500 font-medium">Trending</span>
                <a th:href="|/hashtag/${trend.hashtag}|" 
                   class="font-bold text-zinc-200 group-hover:text-sky-400 group-hover:underline text-xs transition"
                   th:text="|#${trend.hashtag}|">#topic</a>
                <span class="text-[10px] text-zinc-500" th:text="|${trend.tweetCount} Posts|">0 Posts</span>
            </div>
        </div>
    </div>
</aside>

</body>
</html>
