<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<aside th:fragment="right-sidebar" class="hidden lg:block w-80 xl:w-96 min-h-screen px-4 py-3 space-y-4 shrink-0">
    
    <!-- Search Bar -->
    <div class="sticky top-0 bg-[#080c14]/90 backdrop-blur-md pt-1 pb-3 z-10">
        <form th:action="@{/explore}" method="get" class="relative flex items-center">
            <svg class="w-4 h-4 text-zinc-500 absolute left-4 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <input type="text" 
                   name="q" 
                   placeholder="Search ASMJ Biz Connect" 
                   class="w-full bg-zinc-900/80 border border-zinc-800 rounded-full pl-11 pr-4 py-2.5 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-blue-500 focus:bg-zinc-900 transition shadow-inner" />
        </form>
    </div>

    <!-- Trending Topics -->
    <div class="bg-zinc-900/40 border border-zinc-800/80 rounded-3xl p-4 space-y-3">
        <h2 class="text-sm font-black text-white px-1">What's happening</h2>
        
        <div class="space-y-1 divide-y divide-zinc-800/40">
            <div th:each="trend : ${trending}" class="pt-2 pb-1.5 px-1 flex justify-between items-start hover:bg-zinc-800/30 rounded-xl transition cursor-pointer">
                <div>
                    <span class="text-[10px] text-zinc-500 block uppercase font-semibold" th:text="${trend.category}">Trending</span>
                    <a th:href="@{/explore(q='#' + ${trend.hashtag})}" class="font-bold text-xs text-white hover:text-sky-400 transition" th:text="'#' + ${trend.hashtag}">#Topic</a>
                    <span class="text-[10px] text-zinc-500 block mt-0.5" th:text="${trend.tweetCount + ' posts'}">0 posts</span>
                </div>
                <svg class="w-4 h-4 text-zinc-600 hover:text-zinc-400 transition" fill="currentColor" viewBox="0 0 24 24">
                    <circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>
                </svg>
            </div>
        </div>
    </div>

    <!-- Who to Follow -->
    <div th:if="${suggestedUsers != null and !suggestedUsers.isEmpty()}" class="bg-zinc-900/40 border border-zinc-800/80 rounded-3xl p-4 space-y-3">
        <h2 class="text-sm font-black text-white px-1">Who to follow</h2>
        
        <div class="space-y-2">
            <div th:each="user : ${suggestedUsers}" class="flex items-center justify-between p-1.5 hover:bg-zinc-800/30 rounded-2xl transition">
                <a th:href="@{/u/{name}(name=${user.username})}" class="flex items-center space-x-2.5 min-w-0">
                    <div class="w-9 h-9 rounded-full border border-zinc-700/60 bg-blue-600 overflow-hidden flex items-center justify-center font-bold text-white shrink-0 text-xs shadow-inner">
                        <img th:if="${user.avatarUrl != null}" th:src="${user.avatarUrl}" class="w-full h-full object-cover" />
                        <span th:unless="${user.avatarUrl != null}" th:text="${user.displayName != null && !user.displayName.isEmpty() ? user.displayName.substring(0, 1).toUpperCase() : 'U'}">U</span>
                    </div>
                    <div class="flex flex-col min-w-0 text-left">
                        <span class="font-bold text-xs text-white hover:text-sky-400 transition truncate" th:text="${user.displayName}">Name</span>
                        <span class="text-[11px] text-zinc-500 truncate" th:text="|@${user.username}|">@handle</span>
                    </div>
                </a>

                <!-- Follow Button Targeting Itself Directly -->
                <button type="button"
                        th:hx-post="@{/u/{name}/follow(name=${user.username})}"
                        hx-target="this"
                        hx-swap="outerHTML"
                        class="bg-white hover:bg-zinc-200 text-black font-bold px-3 py-1 rounded-full text-xs transition active:scale-95 shadow-sm">
                    Follow
                </button>
            </div>
        </div>
    </div>

    <!-- Footer Links -->
    <div class="px-2 pt-2 text-[11px] text-zinc-500 space-x-2">
        <a th:href="@{/privacy}" class="hover:underline">Privacy Policy</a>
        <span>·</span>
        <span>&copy; 2026 ASMJ Biz Connect</span>
    </div>

</aside>

</body>
</html>
