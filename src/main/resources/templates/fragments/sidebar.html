<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<aside th:fragment="right-sidebar" class="hidden lg:block w-80 xl:w-96 min-h-screen px-4 py-3 space-y-4 shrink-0">
    
    <!-- Search Bar -->
    <div class="sticky top-0 bg-[#080c14]/90 backdrop-blur-md pt-1 pb-3 z-10">
        <form th:action="@{/explore}" method="get" class="relative flex items-center">
            <svg class="w-4 h-4 text-zinc-500 absolute left-4 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <input type="text" 
                   name="q" 
                   placeholder="Search ASMJ Biz Connect" 
                   class="w-full bg-zinc-900/80 border border-zinc-800 rounded-full pl-11 pr-4 py-2.5 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-blue-500 focus:bg-zinc-900 transition shadow-inner" />
        </form>
    </div>

    <!-- Upcoming Events Card (Replaces Follow Box) -->
    <div class="bg-zinc-900/40 border border-zinc-800/80 rounded-3xl p-4 space-y-3">
        <div class="flex items-center justify-between px-1">
            <h2 class="text-sm font-black text-white">Upcoming Events</h2>
            <a th:href="@{/events}" class="text-[11px] text-sky-400 hover:underline">View All</a>
        </div>
        
        <div class="space-y-2">
            <div th:each="evt : ${upcomingEvents}" class="p-2.5 bg-zinc-900/70 border border-zinc-800/60 rounded-2xl space-y-1.5 hover:border-zinc-700 transition">
                <div class="flex items-center justify-between">
                    <span class="text-[9px] font-bold text-sky-400 bg-sky-500/10 px-2 py-0.5 rounded-full uppercase" th:text="${evt.eventType}">Type</span>
                    <span class="text-[10px] text-zinc-500" th:text="${evt.formattedDate}">Date</span>
                </div>
                <h4 class="font-bold text-xs text-white truncate" th:text="${evt.title}">Event Title</h4>
                <div class="flex items-center justify-between pt-1">
                    <span class="text-[11px] font-bold text-emerald-400" th:text="${evt.ticketPrice == 0 || evt.ticketPrice == null} ? 'Free Entry' : |₹${evt.ticketPrice}|">Free</span>
                    <a th:href="@{/events}" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-3 py-1 rounded-full text-[10px] transition shadow-sm active:scale-95">
                        Book
                    </a>
                </div>
            </div>

            <div th:if="${upcomingEvents == null or #lists.isEmpty(upcomingEvents)}" class="text-center py-4 text-xs text-zinc-500">
                No upcoming events this week.
            </div>
        </div>
    </div>

    <!-- What's Happening Card -->
    <div class="bg-zinc-900/40 border border-zinc-800/80 rounded-3xl p-4 space-y-3">
        <h2 class="text-sm font-black text-white px-1">What's happening</h2>
        
        <div class="space-y-1 divide-y divide-zinc-800/40">
            <div th:each="trend : ${trending}" class="pt-2 pb-1.5 px-1 flex justify-between items-start hover:bg-zinc-800/30 rounded-xl transition cursor-pointer">
                <div>
                    <span class="text-[10px] text-zinc-500 block uppercase font-semibold" th:text="${trend.category}">Trending</span>
                    <a th:href="@{/explore(q='#' + ${trend.hashtag})}" class="font-bold text-xs text-white hover:text-sky-400 transition" th:text="'#' + ${trend.hashtag}">#Topic</a>
                    <span class="text-[10px] text-zinc-500 block mt-0.5" th:text="${trend.tweetCount + ' posts'}">0 posts</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer Links -->
    <div class="px-2 pt-2 text-[11px] text-zinc-500 space-x-2">
        <a th:href="@{/privacy}" class="hover:underline">Privacy Policy</a>
        <span>·</span>
        <span>&copy; 2026 ASMJ Biz Connect</span>
    </div>

</aside>

</body>
</html>
