<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<aside th:fragment="left-nav(activeTab)" 
       class="w-16 sm:w-20 xl:w-64 h-screen sticky top-0 py-4 px-2 xl:px-4 flex flex-col justify-between border-r border-zinc-800/80 shrink-0 z-30 select-none bg-[#08080c]/90 backdrop-blur-md">
    
    <div class="space-y-1.5">
        <!-- ASMJ Biz Connect Logo -->
        <a th:href="@{/home}" class="flex items-center justify-center xl:justify-start p-2 rounded-2xl w-fit transition duration-200 mb-2">
            <div th:replace="~{fragments/logo :: app-logo}"></div>
        </a>

        <!-- Home -->
        <a th:href="@{/home}" 
           th:classappend="${activeTab == 'home'} ? 'font-bold text-white bg-zinc-800/60 shadow-sm border border-zinc-700/40' : 'font-medium text-zinc-400 hover:bg-zinc-800/40 hover:text-zinc-100'"
           class="flex items-center space-x-4 px-3.5 py-3 rounded-2xl transition duration-200 text-base w-fit xl:w-full">
            <svg class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
            </svg>
            <span class="hidden xl:inline">Home</span>
        </a>

        <!-- Notifications -->
        <a th:href="@{/notifications}" 
           th:classappend="${activeTab == 'notifications'} ? 'font-bold text-white bg-zinc-800/60 shadow-sm border border-zinc-700/40' : 'font-medium text-zinc-400 hover:bg-zinc-800/40 hover:text-zinc-100'"
           class="flex items-center space-x-4 px-3.5 py-3 rounded-2xl transition duration-200 text-base w-fit xl:w-full relative">
            <div class="relative">
                <svg class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
                </svg>
                <div th:replace="~{fragments/notification-badge :: badge}"></div>
            </div>
            <span class="hidden xl:inline">Notifications</span>
        </a>

        <!-- Messages -->
        <a th:href="@{/messages}" 
           th:classappend="${activeTab == 'messages'} ? 'font-bold text-white bg-zinc-800/60 shadow-sm border border-zinc-700/40' : 'font-medium text-zinc-400 hover:bg-zinc-800/40 hover:text-zinc-100'"
           class="flex items-center space-x-4 px-3.5 py-3 rounded-2xl transition duration-200 text-base w-fit xl:w-full">
            <svg class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
            </svg>
            <span class="hidden xl:inline">Messages</span>
        </a>

        <!-- Marketplace Tab -->
        <a th:href="@{/ads}" 
           th:classappend="${activeTab == 'marketplace'} ? 'font-bold text-white bg-zinc-800/60 shadow-sm border border-zinc-700/40' : 'font-medium text-zinc-400 hover:bg-zinc-800/40 hover:text-zinc-100'"
           class="flex items-center space-x-4 px-3.5 py-3 rounded-2xl transition duration-200 text-base w-fit xl:w-full">
            <svg class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
            </svg>
            <span class="hidden xl:inline">Marketplace</span>
        </a>

        <!-- Resume Creator Tab -->
        <a th:href="@{/resume}" 
           th:classappend="${activeTab == 'resume'} ? 'font-bold text-white bg-zinc-800/60 shadow-sm border border-zinc-700/40' : 'font-medium text-zinc-400 hover:bg-zinc-800/40 hover:text-zinc-100'"
           class="flex items-center space-x-4 px-3.5 py-3 rounded-2xl transition duration-200 text-base w-fit xl:w-full">
            <svg class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            <span class="hidden xl:inline">Resume Creator</span>
        </a>

        <!-- Admin Control Tab -->
        <a sec:authorize="hasRole('ADMIN')" 
           th:href="@{/ads/admin/reviews}" 
           th:classappend="${activeTab == 'admin-ads'} ? 'font-bold text-white bg-amber-500/10 shadow-sm border border-amber-500/30' : 'font-medium text-amber-400/80 hover:bg-zinc-800/40 hover:text-amber-300'"
           class="flex items-center space-x-4 px-3.5 py-3 rounded-2xl transition duration-200 text-base w-fit xl:w-full">
            <svg class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
            </svg>
            <span class="hidden xl:inline">Ad Moderation</span>
        </a>

        <!-- Profile -->
        <a th:href="|/u/${currentUser != null ? currentUser.username : ''}|" 
           th:classappend="${activeTab == 'profile'} ? 'font-bold text-white bg-zinc-800/60 shadow-sm border border-zinc-700/40' : 'font-medium text-zinc-400 hover:bg-zinc-800/40 hover:text-zinc-100'"
           class="flex items-center space-x-4 px-3.5 py-3 rounded-2xl transition duration-200 text-base w-fit xl:w-full">
            <svg class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
            <span class="hidden xl:inline">Profile</span>
        </a>

        <!-- Post Button -->
        <div class="pt-3">
            <a th:href="@{/home#compose-box}" 
               class="bg-gradient-to-r from-sky-500 via-blue-600 to-indigo-600 hover:opacity-90 text-white font-bold p-3 xl:py-3.5 rounded-2xl flex items-center justify-center transition shadow-lg shadow-blue-500/25 active:scale-95">
                <svg class="w-5 h-5 xl:hidden" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                <span class="hidden xl:inline text-sm font-semibold tracking-wide">Post</span>
            </a>
        </div>
    </div>

    <!-- Bottom User Profile Pill -->
    <div class="relative" id="user-menu-wrapper" th:if="${currentUser != null}">
        <div id="user-popup-menu" 
             class="hidden absolute bottom-16 left-0 right-0 xl:w-60 bg-zinc-950/95 border border-zinc-800 rounded-2xl shadow-2xl p-1.5 z-50 animate-fadeIn backdrop-blur-xl">
            <div class="px-3 py-2 border-b border-zinc-800/80 text-xs text-zinc-400">
                Signed in as <span class="font-bold text-zinc-100 block truncate" th:text="|@${currentUser.username}|">@user</span>
            </div>
            <a th:href="|/u/${currentUser.username}|" class="flex items-center space-x-2 px-3 py-2 hover:bg-zinc-800/60 rounded-xl text-xs font-semibold text-zinc-200 transition">
                <svg class="w-4 h-4 text-zinc-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                <span>View Profile</span>
            </a>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="w-full flex items-center space-x-2 px-3 py-2 hover:bg-rose-500/10 text-rose-400 hover:text-rose-300 rounded-xl text-xs font-semibold transition text-left">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                    <span>Log out</span>
                </button>
            </form>
        </div>

        <button type="button" 
                onclick="document.getElementById('user-popup-menu').classList.toggle('hidden')"
                class="w-full flex items-center justify-between p-2 rounded-2xl hover:bg-zinc-800/40 border border-transparent hover:border-zinc-800 transition group">
            <div class="flex items-center space-x-3 min-w-0">
                <div class="w-10 h-10 rounded-full border border-zinc-700 bg-blue-600 overflow-hidden flex items-center justify-center text-xs font-bold text-white shrink-0 shadow-inner">
                    <img th:if="${currentUser.avatarUrl != null}" th:src="${currentUser.avatarUrl}" class="w-full h-full object-cover" />
                    <span th:unless="${currentUser.avatarUrl != null}" th:text="${currentUser.username.substring(0, 1).toUpperCase()}">U</span>
                </div>
                <div class="hidden xl:flex flex-col text-left min-w-0">
                    <span class="font-bold text-xs text-zinc-100 truncate group-hover:text-sky-400 transition" th:text="${currentUser.displayName}">Display Name</span>
                    <span class="text-[11px] text-zinc-500 truncate" th:text="|@${currentUser.username}|">@handle</span>
                </div>
            </div>
            <svg class="w-4 h-4 text-zinc-500 group-hover:text-zinc-300 hidden xl:block shrink-0" fill="currentColor" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
        </button>
    </div>
</aside>

</body>
</html>
