<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<div th:fragment="left-nav(activeTab)">

    <!-- Mobile Top Header (< 768px) -->
    <header class="md:hidden fixed top-0 left-0 right-0 h-14 bg-[#080c14]/90 backdrop-blur-md border-b border-zinc-800/80 px-4 flex items-center justify-between z-40">
        <a th:if="${currentUser != null}" th:href="@{/u/{name}(name=${currentUser.username})}" class="w-8 h-8 rounded-full bg-blue-600 overflow-hidden flex items-center justify-center font-bold text-white text-xs border border-zinc-700/60 shadow-sm">
            <img th:if="${currentUser.avatarUrl != null}" th:src="${currentUser.avatarUrl}" class="w-full h-full object-cover" />
            <span th:unless="${currentUser.avatarUrl != null}" th:text="${currentUser.displayName != null && !currentUser.displayName.isEmpty() ? currentUser.displayName.substring(0, 1).toUpperCase() : 'U'}">U</span>
        </a>
        <div th:unless="${currentUser != null}" class="w-8 h-8"></div>

        <a th:href="@{/home}" class="flex items-center space-x-2">
            <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center font-black text-white text-xs shadow-md">
                A
            </div>
            <span class="font-bold text-xs tracking-tight text-white uppercase">ASMJ Biz Connect</span>
        </a>

        <!-- Mobile Header Logout Form -->
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" class="text-zinc-400 hover:text-rose-400 p-1 transition" title="Log out">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                </svg>
            </button>
        </form>
    </header>

    <!-- Desktop / Tablet Sidebar (>= 768px) -->
    <nav class="hidden md:flex w-20 xl:w-64 min-h-screen flex-col justify-between p-3 border-r border-zinc-800/80 shrink-0 sticky top-0 h-screen select-none bg-[#080c14]">
        <div class="space-y-4">
            <a th:href="@{/home}" class="flex items-center space-x-3 px-3 py-2 rounded-2xl hover:bg-zinc-900/60 transition group w-fit xl:w-full">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center font-black text-white text-base shadow-lg shadow-sky-500/20 group-hover:scale-105 transition-transform">
                    A
                </div>
                <div class="hidden xl:flex flex-col">
                    <span class="font-extrabold text-sm tracking-tight text-white leading-none">ASMJ</span>
                    <span class="text-[10px] font-bold text-sky-400 tracking-wider uppercase mt-0.5">Biz Connect</span>
                </div>
            </a>

            <div class="space-y-1">
                <a th:href="@{/home}" 
                   class="flex items-center space-x-4 px-4 py-3 rounded-2xl transition duration-200 group"
                   th:classappend="${activeTab == 'home'} ? 'font-black text-white bg-zinc-900/80 shadow-sm' : 'text-zinc-400 hover:text-white hover:bg-zinc-900/40 font-medium'">
                    <svg class="w-6 h-6 shrink-0 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                    </svg>
                    <span class="hidden xl:inline text-sm">Home</span>
                </a>

                <a th:href="@{/messages}" 
                   class="flex items-center space-x-4 px-4 py-3 rounded-2xl transition duration-200 group"
                   th:classappend="${activeTab == 'messages'} ? 'font-black text-white bg-zinc-900/80 shadow-sm' : 'text-zinc-400 hover:text-white hover:bg-zinc-900/40 font-medium'">
                    <svg class="w-6 h-6 shrink-0 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                    </svg>
                    <span class="hidden xl:inline text-sm">Messages</span>
                </a>

                <a th:href="@{/marketplace}" 
                   class="flex items-center space-x-4 px-4 py-3 rounded-2xl transition duration-200 group"
                   th:classappend="${activeTab == 'marketplace'} ? 'font-black text-white bg-zinc-900/80 shadow-sm' : 'text-zinc-400 hover:text-white hover:bg-zinc-900/40 font-medium'">
                    <svg class="w-6 h-6 shrink-0 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
                    </svg>
                    <span class="hidden xl:inline text-sm">Marketplace</span>
                </a>

                <a th:href="@{/resume}" 
                   class="flex items-center space-x-4 px-4 py-3 rounded-2xl transition duration-200 group"
                   th:classappend="${activeTab == 'resume'} ? 'font-black text-white bg-zinc-900/80 shadow-sm' : 'text-zinc-400 hover:text-white hover:bg-zinc-900/40 font-medium'">
                    <svg class="w-6 h-6 shrink-0 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                    </svg>
                    <span class="hidden xl:inline text-sm">Resume Creator</span>
                </a>

                <a th:if="${currentUser != null}" th:href="@{/u/{name}(name=${currentUser.username})}" 
                   class="flex items-center space-x-4 px-4 py-3 rounded-2xl transition duration-200 group"
                   th:classappend="${activeTab == 'profile'} ? 'font-black text-white bg-zinc-900/80 shadow-sm' : 'text-zinc-400 hover:text-white hover:bg-zinc-900/40 font-medium'">
                    <svg class="w-6 h-6 shrink-0 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                    <span class="hidden xl:inline text-sm">Profile</span>
                </a>

                <a sec:authorize="hasRole('ADMIN')" th:href="@{/marketplace/admin/moderation}" 
                   class="flex items-center space-x-4 px-4 py-3 rounded-2xl text-amber-400 hover:bg-amber-500/10 font-bold transition duration-200 group border border-amber-500/20 mt-2">
                    <svg class="w-6 h-6 shrink-0 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                    </svg>
                    <span class="hidden xl:inline text-sm">Moderation</span>
                </a>
            </div>

            <button type="button" 
                    onclick="document.getElementById('quick-post-modal').classList.remove('hidden')"
                    class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-blue-500/25 transition active:scale-95 flex items-center justify-center space-x-2">
                <svg class="w-5 h-5 xl:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                <span class="hidden xl:inline text-sm">Post</span>
            </button>
        </div>

        <div class="pt-3 border-t border-zinc-800/80">
            <div class="flex items-center justify-between p-2 rounded-2xl hover:bg-zinc-900/60 transition group">
                <a th:if="${currentUser != null}" th:href="@{/u/{name}(name=${currentUser.username})}" class="flex items-center space-x-3 min-w-0">
                    <div class="w-9 h-9 rounded-full bg-blue-600 border border-zinc-700/60 overflow-hidden flex items-center justify-center font-bold text-white text-xs shrink-0 shadow-inner">
                        <img th:if="${currentUser.avatarUrl != null}" th:src="${currentUser.avatarUrl}" class="w-full h-full object-cover" />
                        <span th:unless="${currentUser.avatarUrl != null}" th:text="${currentUser.displayName != null && !currentUser.displayName.isEmpty() ? currentUser.displayName.substring(0, 1).toUpperCase() : 'U'}">U</span>
                    </div>
                    <div class="hidden xl:flex flex-col min-w-0">
                        <span class="font-bold text-xs text-white truncate" th:text="${currentUser.displayName}">Name</span>
                        <span class="text-[11px] text-zinc-500 truncate" th:text="|@${currentUser.username}|">@handle</span>
                    </div>
                </a>

                <!-- Desktop Sidebar Bottom Profile Logout Form -->
                <form th:action="@{/logout}" method="post" class="hidden xl:block">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="p-1.5 text-zinc-500 hover:text-rose-400 hover:bg-rose-500/10 rounded-xl transition" title="Log out">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                        </svg>
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <!-- Mobile Bottom Navigation Bar (< 768px) -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 h-16 bg-[#080c14]/95 backdrop-blur-lg border-t border-zinc-800 px-3 flex items-center justify-around z-40">
        <a th:href="@{/home}" class="p-2 transition" th:classappend="${activeTab == 'home'} ? 'text-blue-500' : 'text-zinc-400'">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
            </svg>
        </a>

        <a th:href="@{/marketplace}" class="p-2 transition" th:classappend="${activeTab == 'marketplace'} ? 'text-blue-500' : 'text-zinc-400'">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
            </svg>
        </a>

        <button type="button" 
                onclick="document.getElementById('quick-post-modal').classList.remove('hidden')"
                class="w-11 h-11 -mt-5 rounded-full bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center text-white shadow-lg shadow-blue-500/30 active:scale-95 transition">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
            </svg>
        </button>

        <a th:href="@{/messages}" class="p-2 transition" th:classappend="${activeTab == 'messages'} ? 'text-blue-500' : 'text-zinc-400'">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
            </svg>
        </a>

        <a th:href="@{/resume}" class="p-2 transition" th:classappend="${activeTab == 'resume'} ? 'text-blue-500' : 'text-zinc-400'">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
        </a>
    </nav>

</div>

<!-- Quick Post Modal -->
<div id="quick-post-modal" class="hidden fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/80 backdrop-blur-sm">
    <div class="bg-zinc-950 border border-zinc-800 rounded-t-3xl sm:rounded-3xl max-w-lg w-full p-5 sm:p-6 shadow-2xl space-y-4">
        <div class="flex items-center justify-between border-b border-zinc-800 pb-3">
            <h3 class="text-sm font-bold text-white">Create Post</h3>
            <button type="button" onclick="document.getElementById('quick-post-modal').classList.add('hidden')" class="text-zinc-500 hover:text-white text-lg">&times;</button>
        </div>

        <form th:action="@{/timeline/tweets}" method="post" enctype="multipart/form-data" class="space-y-4">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <textarea name="content" rows="4" required placeholder="What's happening in your business network?"
                      class="w-full bg-zinc-900 border border-zinc-800 rounded-2xl p-3.5 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-blue-500 resize-none"></textarea>
            
            <div class="flex items-center justify-between pt-2 border-t border-zinc-800">
                <label class="cursor-pointer text-zinc-400 hover:text-white flex items-center space-x-1.5 text-xs">
                    <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                    </svg>
                    <span>Add Media</span>
                    <input type="file" name="image" accept="image/*" class="hidden" />
                </label>

                <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-5 py-2 rounded-xl text-xs transition shadow-md shadow-blue-500/20 active:scale-95">
                    Post
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Global HTMX CSRF Interceptor -->
<script>
    document.addEventListener('htmx:configRequest', function (evt) {
        let token = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
        let headerName = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content');

        if (!token) {
            const match = document.cookie.match(/(?:^|;\s*)XSRF-TOKEN=([^;]*)/);
            if (match) {
                token = decodeURIComponent(match[1]);
                headerName = 'X-XSRF-TOKEN';
            }
        }

        if (token) {
            evt.detail.headers[headerName || 'X-CSRF-TOKEN'] = token;
            evt.detail.headers['X-XSRF-TOKEN'] = token;
            evt.detail.headers['X-CSRF-TOKEN'] = token;
        }
    });
</script>

</body>
</html>
