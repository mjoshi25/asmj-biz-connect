<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="cart-drawer-content" id="cart-drawer-content" class="h-full flex flex-col justify-between">
    
    <div class="p-4 sm:p-5 border-b border-zinc-800 flex items-center justify-between bg-zinc-950/80">
        <div class="flex items-center space-x-2">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
            <h2 class="text-sm font-bold text-white">Your Shopping Basket</h2>
            <span class="bg-blue-600/30 text-blue-400 font-bold text-[10px] px-2 py-0.5 rounded-full" th:text="${cart.totalItemCount + ' Items'}">0 Items</span>
        </div>
        <button type="button" onclick="toggleCartDrawer()" class="text-zinc-500 hover:text-white text-lg">&times;</button>
    </div>

    <div class="flex-1 overflow-y-auto p-4 sm:p-5 space-y-3 divide-y divide-zinc-800/40">
        <div th:if="${#lists.isEmpty(cart.items)}" class="h-full flex flex-col items-center justify-center text-center text-zinc-500 text-xs py-12">
            <svg class="w-12 h-12 text-zinc-700 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
            </svg>
            <p class="font-bold text-zinc-400">Your basket is empty</p>
            <p class="text-[11px] text-zinc-600 mt-0.5">Click "Pick & Put in Cart" on any shelf item to start shopping!</p>
        </div>

        <div th:each="item : ${cart.items}" class="pt-3 first:pt-0 flex items-center justify-between gap-3">
            <div class="flex items-center space-x-3 min-w-0">
                <div class="w-11 h-11 rounded-xl bg-zinc-900 border border-zinc-800 overflow-hidden flex items-center justify-center shrink-0">
                    <img th:if="${item.imageUrl != null and !item.imageUrl.isEmpty()}" th:src="${item.imageUrl}" class="w-full h-full object-cover" />
                    <span th:unless="${item.imageUrl != null and !item.imageUrl.isEmpty()}" class="text-[10px] text-zinc-600 font-bold">📦</span>
                </div>
                <div class="min-w-0">
                    <h4 class="font-bold text-xs text-white truncate" th:text="${item.title}">Product Title</h4>
                    <span class="text-[10px] text-zinc-500" th:text="|₹${item.unitPrice} each · @${item.sellerUsername}|">Price</span>
                </div>
            </div>

            <!-- Qty Controls Form for Safe CSRF POST -->
            <div class="flex items-center space-x-2 shrink-0">
                <div class="flex items-center bg-zinc-900 border border-zinc-800 rounded-lg p-0.5">
                    <form th:action="@{/marketplace/cart/update}" method="post"
                          hx-post="/marketplace/cart/update"
                          hx-target="#cart-drawer-content"
                          hx-swap="outerHTML">
                        <input type="hidden" name="productId" th:value="${item.productId}" />
                        <input type="hidden" name="delta" value="-1" />
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="w-5 h-5 flex items-center justify-center text-zinc-400 hover:text-white font-bold text-xs">-</button>
                    </form>

                    <span class="px-2 text-xs font-bold text-white" th:text="${item.quantity}">1</span>

                    <form th:action="@{/marketplace/cart/update}" method="post"
                          hx-post="/marketplace/cart/update"
                          hx-target="#cart-drawer-content"
                          hx-swap="outerHTML">
                        <input type="hidden" name="productId" th:value="${item.productId}" />
                        <input type="hidden" name="delta" value="1" />
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="w-5 h-5 flex items-center justify-center text-zinc-400 hover:text-white font-bold text-xs">+</button>
                    </form>
                </div>

                <form th:action="@{/marketplace/cart/remove}" method="post"
                      hx-post="/marketplace/cart/remove"
                      hx-target="#cart-drawer-content"
                      hx-swap="outerHTML">
                    <input type="hidden" name="productId" th:value="${item.productId}" />
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="text-zinc-600 hover:text-rose-500 p-1 transition" title="Remove">&times;</button>
                </form>
            </div>
        </div>
    </div>

    <div class="p-4 sm:p-5 border-t border-zinc-800 bg-zinc-950/90 space-y-3" th:if="${!#lists.isEmpty(cart.items)}">
        <div class="flex justify-between items-center text-xs">
            <span class="text-zinc-400 font-medium">Subtotal</span>
            <strong class="text-base text-emerald-400 font-bold" th:text="|₹${cart.grandTotal}|">₹0.00</strong>
        </div>

        <button type="button" 
                onclick="document.getElementById('checkout-modal').classList.remove('hidden')"
                class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-lg shadow-emerald-600/20 active:scale-95">
            Proceed to Checkout
        </button>
    </div>

</div>

</body>
</html>
