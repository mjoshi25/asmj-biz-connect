<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="edit-modal" 
     id="edit-profile-backdrop"
     class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 animate-fadeIn"
     onclick="if(event.target === this) document.getElementById('modal-container').innerHTML = ''">

    <div class="relative max-w-lg w-full bg-gray-950 rounded-2xl overflow-hidden border border-gray-800 shadow-2xl">
        <form th:action="|/u/${user.username}/edit|" 
              method="post" 
              enctype="multipart/form-data">

            <!-- Modal Header -->
            <div class="flex items-center justify-between p-4 border-b border-gray-800">
                <div class="flex items-center space-x-4">
                    <button type="button" 
                            onclick="document.getElementById('modal-container').innerHTML = ''"
                            class="text-gray-400 hover:text-white p-1 rounded-full hover:bg-gray-800 transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                    <h2 class="text-lg font-bold text-white">Edit profile</h2>
                </div>
                <button type="submit" 
                        class="bg-white text-black hover:bg-gray-200 font-bold px-4 py-1 rounded-full text-sm transition">
                    Save
                </button>
            </div>

            <!-- Modal Body -->
            <div class="max-h-[80vh] overflow-y-auto">
                <!-- Banner Upload -->
                <div class="relative h-32 bg-gray-800 flex items-center justify-center overflow-hidden group">
                    <img id="banner-preview" 
                         th:if="${user.bannerUrl != null}" 
                         th:src="${user.bannerUrl}" 
                         class="w-full h-full object-cover" />
                    <div th:unless="${user.bannerUrl != null}" class="w-full h-full bg-gradient-to-r from-sky-800 to-indigo-900"></div>

                    <label class="absolute inset-0 flex items-center justify-center bg-black/40 opacity-0 group-hover:opacity-100 cursor-pointer transition">
                        <input type="file" name="banner" accept="image/*" class="hidden" 
                               onchange="const r = new FileReader(); r.onload = e => { const b = document.getElementById('banner-preview'); if(b) b.src = e.target.result; }; r.readAsDataURL(this.files[0]);" />
                        <svg class="w-8 h-8 text-white/80 hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
                        </svg>
                    </label>
                </div>

                <!-- Avatar Upload -->
                <div class="px-4 -mt-12 mb-4 relative">
                    <div class="relative w-24 h-24 rounded-full border-4 border-gray-950 bg-sky-600 overflow-hidden flex items-center justify-center text-3xl font-bold group">
                        <img id="avatar-preview" 
                             th:if="${user.avatarUrl != null}" 
                             th:src="${user.avatarUrl}" 
                             class="w-full h-full object-cover" />
                        <span th:unless="${user.avatarUrl != null}" 
                              th:text="${user.username.substring(0, 1).toUpperCase()}">U</span>

                        <label class="absolute inset-0 flex items-center justify-center bg-black/50 opacity-0 group-hover:opacity-100 cursor-pointer transition">
                            <input type="file" name="avatar" accept="image/*" class="hidden"
                                   onchange="const r = new FileReader(); r.onload = e => { const a = document.getElementById('avatar-preview'); if(a) a.src = e.target.result; }; r.readAsDataURL(this.files[0]);" />
                            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
                            </svg>
                        </label>
                    </div>
                </div>

                <!-- Form Inputs -->
                <div class="p-4 space-y-4">
                    <div class="border border-gray-700 rounded-lg p-2 focus-within:border-sky-500 transition">
                        <label class="block text-xs text-gray-500">Name</label>
                        <input type="text" 
                               name="displayName" 
                               th:value="${user.displayName}" 
                               maxlength="50" 
                               required
                               class="w-full bg-transparent text-white outline-none text-sm pt-1" />
                    </div>

                    <div class="border border-gray-700 rounded-lg p-2 focus-within:border-sky-500 transition">
                        <label class="block text-xs text-gray-500">Bio</label>
                        <textarea name="bio" 
                                  maxlength="160" 
                                  rows="3"
                                  placeholder="Add your bio"
                                  class="w-full bg-transparent text-white outline-none text-sm pt-1 resize-none"
                                  th:text="${user.bio}"></textarea>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>

</body>
</html>
