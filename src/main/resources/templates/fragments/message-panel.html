<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="chat-window" id="chat-window-container" class="flex-1 flex flex-col h-full bg-[#080c14] min-w-0">
    
    <!-- Chat Header -->
    <div class="h-14 md:h-16 px-4 md:px-6 border-b border-zinc-800/80 flex items-center justify-between bg-[#080c14]/80 backdrop-blur-md sticky top-0 z-10">
        <div class="flex items-center space-x-3 min-w-0" th:if="${activeConversation != null}">
            <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-full bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center font-bold text-white text-xs sm:text-sm shrink-0 shadow-sm">
                <span th:text="${activeConversation.name != null && !activeConversation.name.isEmpty() ? activeConversation.name.substring(0, 1).toUpperCase() : 'C'}">C</span>
            </div>
            <div class="flex flex-col min-w-0">
                <span class="font-bold text-xs sm:text-sm text-white truncate" th:text="${activeConversation.name != null ? activeConversation.name : 'Conversation'}">Chat</span>
                <span class="text-[10px] sm:text-[11px] text-zinc-500 flex items-center space-x-1">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                    <span th:text="${activeConversation.isGroup} ? |${activeConversation.participantUsernames.size()} members| : 'Active now'">Status</span>
                </span>
            </div>
        </div>

        <div th:unless="${activeConversation != null}" class="text-zinc-500 text-xs py-2">
            Select a conversation to start chatting
        </div>
    </div>

    <!-- Message Bubble Scroll Area -->
    <div id="message-feed" class="flex-1 p-3 sm:p-6 overflow-y-auto space-y-3">
        <div th:replace="~{fragments/message-panel :: message-bubble-list}"></div>
    </div>

    <!-- Message Input Bar (Fixed bottom padding for mobile navigation clearance) -->
    <div class="p-3 sm:p-4 border-t border-zinc-800/80 bg-zinc-950/40" th:if="${activeConvoId != null}">
        <form hx-post="/messages/send"
              hx-encoding="multipart/form-data"
              hx-target="#message-feed"
              hx-swap="innerHTML"
              hx-on::after-request="if(event.detail.successful) { this.reset(); scrollMessageFeedToBottom(); }"
              class="flex items-center space-x-2 bg-zinc-900/90 border border-zinc-800 rounded-2xl px-3 py-1.5 sm:px-4 sm:py-2 focus-within:border-blue-500 transition">
            
            <input type="hidden" name="conversationId" th:value="${activeConvoId}" />
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <label class="cursor-pointer text-zinc-400 hover:text-white p-1 transition" title="Attach file">
                <input type="file" name="file" class="hidden" />
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" />
                </svg>
            </label>

            <input type="text" 
                   name="content" 
                   autocomplete="off"
                   placeholder="Start a message..." 
                   class="flex-1 bg-transparent text-xs text-white placeholder-zinc-500 focus:outline-none" />

            <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white p-2 rounded-xl transition shadow-md shadow-blue-500/20 active:scale-95">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                </svg>
            </button>
        </form>
    </div>
</div>

<!-- Message Bubble Fragment -->
<div th:fragment="message-bubble-list">
    <div th:if="${#lists.isEmpty(messages)}" class="h-full flex flex-col items-center justify-center text-center text-zinc-500 text-xs py-12">
        <span>No messages yet. Send a greeting to start the conversation!</span>
    </div>

    <div th:each="msg : ${messages}" 
         class="flex flex-col mb-2.5"
         th:classappend="${msg.self} ? 'items-end' : 'items-start'">
        
        <span th:if="${!msg.self and msg.isGroup}" class="text-[10px] text-zinc-500 mb-1 ml-1" th:text="${msg.senderDisplayName}">Sender</span>

        <div class="max-w-[82%] sm:max-w-[70%] rounded-2xl px-3.5 py-2 text-xs shadow-sm leading-relaxed"
             th:classappend="${msg.self} ? 'bg-blue-600 text-white rounded-br-none' : 'bg-zinc-800/90 text-zinc-200 border border-zinc-700/50 rounded-bl-none'">
            
            <p th:if="${msg.content != null && !msg.content.isEmpty()}" th:text="${msg.content}" class="break-words"></p>

            <div th:if="${msg.mediaUrl != null}" class="mt-2 rounded-xl overflow-hidden border border-white/10">
                <img th:if="${msg.mediaType == 'IMAGE'}" th:src="${msg.mediaUrl}" class="max-h-52 w-full object-cover" />
                <a th:unless="${msg.mediaType == 'IMAGE'}" th:href="${msg.mediaUrl}" target="_blank" class="flex items-center space-x-2 p-2 bg-black/30 hover:bg-black/50 text-white underline text-[11px]">
                    <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                    <span class="truncate" th:text="${msg.originalFileName != null ? msg.originalFileName : 'Download File'}">Attachment</span>
                </a>
            </div>
        </div>

        <span class="text-[9px] text-zinc-600 mt-0.5 px-1" th:text="${msg.createdAtFormatted}">Time</span>
    </div>
</div>

</body>
</html>
