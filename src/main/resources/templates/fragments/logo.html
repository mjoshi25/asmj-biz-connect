<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="app-logo" class="flex items-center space-x-3 group">
    <!-- ASMJ Custom Monogram Node Emblem -->
    <div class="relative w-10 h-10 rounded-2xl bg-gradient-to-tr from-sky-500 via-blue-600 to-indigo-600 flex items-center justify-center shadow-lg shadow-blue-500/25 border border-blue-400/30 group-hover:scale-105 group-hover:shadow-blue-500/40 transition-all duration-300">
        <div class="absolute inset-0 bg-white/15 rounded-2xl blur-[1px]"></div>
        
        <svg class="w-5 h-5 text-white relative z-10 drop-shadow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 20L12 4l8 16M7 14h10M12 10v10" />
        </svg>
    </div>

    <!-- Wordmark -->
    <div class="hidden xl:flex flex-col text-left">
        <span class="font-extrabold text-lg text-white tracking-tight leading-none group-hover:text-sky-400 transition-colors">
            ASMJ
        </span>
        <span class="text-[10px] text-zinc-400 font-bold tracking-wider uppercase mt-0.5">Biz Connect</span>
    </div>
</div>

</body>
</html>
