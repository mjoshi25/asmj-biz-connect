<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="app-logo" class="flex items-center space-x-3 group">
    <!-- Monogram Emblem -->
    <div class="relative w-10 h-10 rounded-2xl bg-gradient-to-tr from-sky-500 via-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/25 border border-indigo-400/30 group-hover:scale-105 group-hover:shadow-indigo-500/40 transition-all duration-300">
        <div class="absolute inset-0 bg-white/20 rounded-2xl blur-[1px]"></div>
        
        <!-- Nexus Hex-N Path -->
        <svg class="w-5 h-5 text-white relative z-10 drop-shadow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 18V6l9 12V6M15 18V9l3 3v6" />
        </svg>
    </div>

    <!-- Wordmark -->
    <div class="hidden xl:flex flex-col text-left">
        <span class="font-extrabold text-lg text-white tracking-tight leading-none group-hover:text-sky-400 transition-colors">
            Nexus
        </span>
        <span class="text-[10px] text-zinc-500 font-semibold tracking-widest uppercase mt-0.5">Network</span>
    </div>
</div>

</body>
</html>
