<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<span th:fragment="badge" 
      id="notification-badge"
      th:classappend="${unreadCount > 0} ? '' : 'hidden'"
      class="absolute -top-1 -right-1 bg-sky-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full leading-none"
      th:text="${unreadCount > 99 ? '99+' : unreadCount}">0</span>

</body>
</html>
