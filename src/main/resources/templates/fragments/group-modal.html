<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="create-group-modal" 
     id="group-modal-backdrop"
     class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 animate-fadeIn"
     onclick="if(event.target === this) document.getElementById('modal-container').innerHTML = ''">

    <div class="relative max-w-md w-full bg-gray-950 rounded-2xl border border-gray-800 shadow-2xl overflow-hidden">
        <form th:action="@{/messages/group/create}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <!-- Header -->
            <div class="flex items-center justify-between p-4 border-b border-gray-800">
                <div class="flex items-center space-x-3">
                    <button type="button" 
                            onclick="document.getElementById('modal-container').innerHTML = ''"
                            class="text-gray-400 hover:text-white p-1 rounded-full hover:bg-gray-800 transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                    <h2 class="text-lg font-bold text-white">New Group</h2>
                </div>
                <button type="submit" class="bg-white text-black hover:bg-gray-200 font-bold px-4 py-1 rounded-full text-sm transition">
                    Create
                </button>
            </div>

            <!-- Body -->
            <div class="p-4 space-y-4 max-h-[70vh] overflow-y-auto">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">Group Name</label>
                    <input type="text" 
                           name="name" 
                           required 
                           maxlength="50"
                           placeholder="e.g. Spring Boot Enthusiasts"
                           class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3.5 py-2 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-sky-500 transition" />
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-2">Select Members</label>
                    <div class="space-y-2 divide-y divide-gray-800/60">
                        <div th:if="${#lists.isEmpty(eligibleMembers)}" class="text-xs text-gray-500 py-3 text-center">
                            Follow users first to add them to groups.
                        </div>
                        <label th:each="user : ${eligibleMembers}" 
                               class="flex items-center justify-between py-2 cursor-pointer hover:bg-gray-900/50 px-2 rounded-xl transition">
                            <div class="flex items-center space-x-3 min-w-0">
                                <div class="w-9 h-9 rounded-full bg-sky-600 flex items-center justify-center font-bold text-white text-xs shrink-0 overflow-hidden">
                                    <img th:if="${user.avatarUrl != null}" th:src="${user.avatarUrl}" class="w-full h-full object-cover" />
                                    <span th:unless="${user.avatarUrl != null}" th:text="${user.username.substring(0, 1).toUpperCase()}">U</span>
                                </div>
                                <div class="min-w-0">
                                    <p class="text-sm font-bold text-white truncate" th:text="${user.displayName}">Name</p>
                                    <p class="text-xs text-gray-500 truncate" th:text="|@${user.username}|">@handle</p>
                                </div>
                            </div>
                            <input type="checkbox" 
                                   name="memberUsernames" 
                                   th:value="${user.username}" 
                                   class="w-4 h-4 rounded text-sky-500 bg-gray-900 border-gray-700 focus:ring-0 focus:ring-offset-0 cursor-pointer" />
                        </label>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>

</body>
</html>
