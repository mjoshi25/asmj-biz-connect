<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create your account / Nexus</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/animations.css}" />
</head>
<body class="bg-[#08080c] text-zinc-100 min-h-screen flex items-center justify-center p-4 antialiased selection:bg-indigo-500 selection:text-white">

    <div class="max-w-md w-full bg-zinc-950/80 border border-zinc-800/80 rounded-3xl p-8 shadow-2xl backdrop-blur-xl space-y-6">
        
        <!-- Brand Emblem Header -->
        <div class="flex flex-col items-center text-center space-y-3">
            <div class="relative w-12 h-12 rounded-2xl bg-gradient-to-tr from-sky-500 via-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/25 border border-indigo-400/30">
                <div class="absolute inset-0 bg-white/20 rounded-2xl blur-[1px]"></div>
                <svg class="w-6 h-6 text-white relative z-10 drop-shadow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 18V6l9 12V6M15 18V9l3 3v6" />
                </svg>
            </div>
            <div>
                <h1 class="text-2xl font-black text-white tracking-tight">Join Nexus today</h1>
                <p class="text-xs text-zinc-400 mt-1">Create your profile and start networking</p>
            </div>
        </div>

        <!-- Registration Form -->
        <form th:action="@{/register}" method="post" class="space-y-3.5">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div>
                <label class="block text-xs font-semibold text-zinc-300 mb-1">Display Name</label>
                <input type="text" 
                       name="displayName" 
                       required 
                       placeholder="e.g. Alex Rivera" 
                       class="w-full bg-zinc-900/80 border border-zinc-800 rounded-2xl px-4 py-2 text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-indigo-500 focus:bg-zinc-900 transition" />
            </div>

            <div>
                <label class="block text-xs font-semibold text-zinc-300 mb-1">Username</label>
                <input type="text" 
                       name="username" 
                       required 
                       placeholder="e.g. alex_rivera" 
                       class="w-full bg-zinc-900/80 border border-zinc-800 rounded-2xl px-4 py-2 text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-indigo-500 focus:bg-zinc-900 transition" />
            </div>

            <div>
                <label class="block text-xs font-semibold text-zinc-300 mb-1">Email</label>
                <input type="email" 
                       name="email" 
                       required 
                       placeholder="alex@example.com" 
                       class="w-full bg-zinc-900/80 border border-zinc-800 rounded-2xl px-4 py-2 text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-indigo-500 focus:bg-zinc-900 transition" />
            </div>

            <div>
                <label class="block text-xs font-semibold text-zinc-300 mb-1">Password</label>
                <input type="password" 
                       name="password" 
                       required 
                       placeholder="••••••••" 
                       class="w-full bg-zinc-900/80 border border-zinc-800 rounded-2xl px-4 py-2 text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-indigo-500 focus:bg-zinc-900 transition" />
            </div>

            <button type="submit" 
                    class="w-full bg-gradient-to-r from-sky-500 via-indigo-500 to-purple-600 hover:opacity-95 text-white font-bold py-3 rounded-2xl text-sm transition shadow-lg shadow-indigo-500/25 active:scale-[0.99] mt-2">
                Create Account
            </button>
        </form>

        <!-- Footer / Back to Login -->
        <div class="pt-4 border-t border-zinc-800/80 text-center text-xs text-zinc-500">
            Already have a Nexus account? 
            <a th:href="@{/login}" class="text-indigo-400 font-semibold hover:text-indigo-300 hover:underline">Log in</a>
        </div>
    </div>

</body>
</html>
