<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Product Listings / ASMJ Biz Connect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body class="bg-[#080c14] text-zinc-100 min-h-screen antialiased p-4 sm:p-8">

    <div class="max-w-5xl mx-auto space-y-8">
        
        <!-- Header -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between border-b border-zinc-800 pb-4 gap-4">
            <div>
                <h1 class="text-xl sm:text-2xl font-black text-white tracking-tight">Manage Products & Services</h1>
                <p class="text-xs text-zinc-500">Post and moderate your items for sale or service offerings</p>
            </div>
            <div class="flex items-center gap-3">
                <a th:href="@{/products-services}" class="text-xs text-sky-400 hover:underline font-semibold">&larr; Back to Marketplace</a>
                <a th:href="@{/marketplace}" class="text-xs text-zinc-400 hover:text-white font-semibold">Platform Hub</a>
            </div>
        </div>

        <!-- Post New Product Form -->
        <div class="bg-zinc-900/60 border border-zinc-800 rounded-2xl p-6 space-y-4">
            <h2 class="text-sm font-bold text-white uppercase tracking-wider">List a Product or Service</h2>
            
            <form th:action="@{/products-services/post}" method="post" enctype="multipart/form-data" class="space-y-4">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[11px] font-bold text-zinc-400 uppercase mb-1">Item Title</label>
                        <input type="text" name="title" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-2.5 text-xs text-white focus:border-sky-500 focus:outline-none" placeholder="e.g., MacBook Pro M3"/>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-zinc-400 uppercase mb-1">Category</label>
                        <input type="text" name="category" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-2.5 text-xs text-white focus:border-sky-500 focus:outline-none" placeholder="e.g., Electronics"/>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-[11px] font-bold text-zinc-400 uppercase mb-1">Price (₹)</label>
                        <input type="number" step="0.01" name="price" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-2.5 text-xs text-white focus:border-sky-500 focus:outline-none" placeholder="0.00"/>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-zinc-400 uppercase mb-1">Location</label>
                        <input type="text" name="location" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-2.5 text-xs text-white focus:border-sky-500 focus:outline-none" placeholder="e.g., Bengaluru"/>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-zinc-400 uppercase mb-1">Product Image</label>
                        <input type="file" name="imageFile" accept="image/*" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-2 text-xs text-zinc-400 file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-sky-600 file:text-white hover:file:bg-sky-500"/>
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-zinc-400 uppercase mb-1">Description</label>
                    <textarea name="description" rows="3" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-2.5 text-xs text-white focus:border-sky-500 focus:outline-none" placeholder="Provide specs, condition, and contact details..."></textarea>
                </div>

                <button type="submit" class="bg-sky-600 hover:bg-sky-500 text-white font-bold px-5 py-2.5 rounded-xl text-xs transition">
                    Publish Listing
                </button>
            </form>
        </div>

        <!-- My Products List -->
        <div class="space-y-4">
            <h2 class="text-sm font-bold text-white uppercase tracking-wider">Your Product & Service Listings</h2>

            <div th:if="${myProducts == null || #lists.isEmpty(myProducts)}" class="p-6 text-center text-zinc-500 text-xs border border-zinc-900 rounded-2xl bg-zinc-950/40">
                You haven't posted any products or services yet.
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4" th:if="${myProducts != null && !#lists.isEmpty(myProducts)}">
                <div th:each="prod : ${myProducts}" class="bg-zinc-900/60 border border-zinc-800 rounded-2xl p-5 space-y-4 flex flex-col justify-between">
                    <div class="space-y-2">
                        <div class="flex justify-between items-start">
                            <span class="text-[10px] font-bold px-2.5 py-0.5 rounded-full border"
                                  th:classappend="${prod.status?.name() == 'APPROVED'} ? 'bg-emerald-950 text-emerald-400 border-emerald-800' : (${prod.status?.name() == 'REJECTED'} ? 'bg-red-950 text-red-400 border-red-800' : 'bg-amber-950 text-amber-400 border-amber-800')"
                                  th:text="${prod.status}">PENDING</span>
                            <span class="text-xs font-semibold text-sky-400" th:text="|₹${prod.price}|">Price</span>
                        </div>
                        <h3 class="font-bold text-sm text-white" th:text="${prod.title}">Title</h3>
                        <p class="text-xs text-zinc-400 line-clamp-2" th:text="${prod.description}">Description</p>
                        
                        <div th:if="${prod.status?.name() == 'REJECTED' && prod.rejectionReason != null}" class="text-xs text-red-300 bg-red-950/30 p-2.5 rounded-xl border border-red-900/50">
                            <span class="font-bold">Rejection Reason:</span> <span th:text="${prod.rejectionReason}">Reason</span>
                        </div>
                    </div>

                    <div class="pt-3 border-t border-zinc-800 space-y-3">
                        <form th:action="@{/products-services/delete/{id}(id=${prod.id})}" method="post" class="flex gap-2">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <a th:href="@{/products-services/edit/{id}(id=${prod.id})}" class="flex-1 text-center bg-zinc-800 hover:bg-zinc-700 text-zinc-200 font-bold py-2 rounded-xl text-xs transition">
                                Edit
                            </a>
                            <button type="submit" onclick="return confirm('Delete this listing?');" class="flex-1 bg-red-950/60 hover:bg-red-900 text-red-400 font-bold py-2 rounded-xl text-xs transition border border-red-800">
                                Delete
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
