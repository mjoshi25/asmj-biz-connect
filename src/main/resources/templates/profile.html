<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title th:text="|${profile.user.displayName} (@${profile.user.username}) / ASMJ Biz Connect|">Profile / ASMJ Biz Connect</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg(v=2)}" />
    <link rel="alternate icon" type="image/x-icon" th:href="@{/favicon.ico(v=2)}" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body class="bg-[#080c14] text-zinc-100 min-h-screen antialiased">

    <div class="max-w-[1400px] mx-auto flex justify-center min-h-screen">

        <!-- Navigation Bar -->
        <div th:replace="~{fragments/navigation :: left-nav(activeTab='profile')}"></div>

        <!-- Middle Column: Profile Content -->
        <main class="w-full md:max-w-2xl lg:max-w-2xl xl:max-w-2xl border-x border-zinc-800/80 min-h-screen pt-14 md:pt-0 pb-24">
            
            <!-- Sticky Header -->
            <div class="sticky top-14 md:top-0 bg-[#080c14]/90 backdrop-blur-md border-b border-zinc-800/80 px-4 py-2.5 z-20 flex items-center space-x-4">
                <a th:href="@{/home}" class="p-1.5 rounded-full hover:bg-zinc-800 transition">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                </a>
                <div class="min-w-0">
                    <h1 class="text-sm sm:text-base font-bold text-white truncate max-w-[200px] sm:max-w-xs" th:text="${profile.user.displayName}">Name</h1>
                    <span class="text-[11px] text-zinc-500" th:text="${profile.tweetsCount + ' Posts'}">0 Posts</span>
                </div>
            </div>

            <!-- Banner & Avatar Section -->
            <div class="relative">
                <div class="h-32 sm:h-44 w-full bg-zinc-800 overflow-hidden">
                    <img th:if="${profile.user.bannerUrl != null}" th:src="${profile.user.bannerUrl}" class="w-full h-full object-cover" />
                    <div th:unless="${profile.user.bannerUrl != null}" class="w-full h-full bg-gradient-to-r from-blue-900 to-indigo-950"></div>
                </div>

                <div class="px-4 pb-4">
                    <div class="flex justify-between items-end relative -mt-12 sm:-mt-16 mb-3">
                        <div class="w-20 h-20 sm:w-28 sm:h-28 rounded-full border-4 border-[#080c14] bg-blue-600 overflow-hidden flex items-center justify-center font-bold text-white text-xl sm:text-2xl shadow-xl shrink-0">
                            <img th:if="${profile.user.avatarUrl != null}" th:src="${profile.user.avatarUrl}" class="w-full h-full object-cover" />
                            <span th:unless="${profile.user.avatarUrl != null}" th:text="${profile.user.displayName != null && !profile.user.displayName.isEmpty() ? profile.user.displayName.substring(0, 1).toUpperCase() : 'U'}">U</span>
                        </div>

                        <!-- Action Button: Edit or Follow -->
                        <div>
                            <button th:if="${!profile.self}" th:replace="~{fragments/profile-actions :: follow-button}"></button>
                            <button th:if="${profile.self}" 
                                    type="button"
                                    onclick="document.getElementById('edit-profile-modal').classList.remove('hidden')"
                                    class="border border-zinc-600 hover:border-zinc-500 text-white font-bold px-3.5 py-1.5 rounded-full text-xs transition active:scale-95">
                                Edit profile
                            </button>
                        </div>
                    </div>

                    <!-- User Bio Details -->
                    <div class="space-y-2.5">
                        <div>
                            <h2 class="text-base sm:text-lg font-bold text-white leading-tight" th:text="${profile.user.displayName}">Name</h2>
                            <p class="text-xs text-zinc-500" th:text="|@${profile.user.username}|">@handle</p>
                        </div>

                        <p th:if="${profile.user.bio != null && !profile.user.bio.isEmpty()}" 
                           class="text-xs text-zinc-200 leading-relaxed break-words" 
                           th:text="${profile.user.bio}">Bio content.</p>

                        <div class="flex flex-wrap gap-y-1 gap-x-3 text-[11px] sm:text-xs text-zinc-500">
                            <div th:if="${profile.user.location != null && !profile.user.location.isEmpty()}" class="flex items-center space-x-1">
                                <svg class="w-3.5 h-3.5 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/></svg>
                                <span th:text="${profile.user.location}">Location</span>
                            </div>

                            <div th:if="${profile.user.website != null && !profile.user.website.isEmpty()}" class="flex items-center space-x-1">
                                <svg class="w-3.5 h-3.5 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>
                                <a th:href="${profile.user.website}" target="_blank" class="text-sky-400 hover:underline" th:text="${profile.user.website}">website.com</a>
                            </div>

                            <div class="flex items-center space-x-1">
                                <svg class="w-3.5 h-3.5 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                                <span th:text="${profile.user.joinedDateFormatted}">Joined Date</span>
                            </div>
                        </div>

                        <!-- Follow Counts -->
                        <div class="flex space-x-4 text-xs">
                            <div class="flex space-x-1">
                                <strong class="text-white" th:text="${profile.followingCount}">0</strong>
                                <span class="text-zinc-500">Following</span>
                            </div>
                            <div class="flex space-x-1">
                                <strong class="text-white" th:text="${profile.followersCount}">0</strong>
                                <span class="text-zinc-500">Followers</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Feed Tabs -->
            <div class="flex border-b border-zinc-800/80 text-xs font-bold text-center">
                <div class="flex-1 py-3 text-white border-b-2 border-blue-500">Posts</div>
                <div class="flex-1 py-3 text-zinc-500 hover:text-zinc-300 transition cursor-pointer">Replies</div>
                <div class="flex-1 py-3 text-zinc-500 hover:text-zinc-300 transition cursor-pointer">Media</div>
            </div>

            <!-- User Posts Feed -->
            <div th:replace="~{fragments/tweet-feed :: tweet-list}"></div>
        </main>

        <!-- Right Sidebar -->
        <div th:replace="~{fragments/sidebar :: right-sidebar}"></div>
    </div>

    <!-- Edit Profile Modal -->
    <div id="edit-profile-modal" th:if="${profile.self}" class="hidden fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/80 backdrop-blur-sm">
        <div class="bg-zinc-950 border border-zinc-800 rounded-t-3xl sm:rounded-3xl max-w-lg w-full p-5 sm:p-6 shadow-2xl space-y-3.5 max-h-[85vh] overflow-y-auto">
            
            <div class="flex items-center justify-between border-b border-zinc-800 pb-3">
                <h3 class="text-sm font-bold text-white">Edit Profile</h3>
                <button type="button" onclick="document.getElementById('edit-profile-modal').classList.add('hidden')" class="text-zinc-500 hover:text-white text-lg">&times;</button>
            </div>

            <form th:action="@{/u/edit}" method="post" enctype="multipart/form-data" class="space-y-3 text-xs">
                <div>
                    <label class="block text-zinc-400 mb-1 font-semibold">Display Name</label>
                    <input type="text" name="displayName" th:value="${profile.user.displayName}" required
                           class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3.5 py-2 text-white focus:outline-none focus:border-blue-500" />
                </div>

                <div>
                    <label class="block text-zinc-400 mb-1 font-semibold">Bio</label>
                    <textarea name="bio" rows="2" th:text="${profile.user.bio}"
                              class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3.5 py-2 text-white focus:outline-none focus:border-blue-500 resize-none"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-zinc-400 mb-1 font-semibold">Location</label>
                        <input type="text" name="location" th:value="${profile.user.location}"
                               class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-blue-500" />
                    </div>
                    <div>
                        <label class="block text-zinc-400 mb-1 font-semibold">Website</label>
                        <input type="text" name="website" th:value="${profile.user.website}"
                               class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-blue-500" />
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2 pt-1">
                    <div>
                        <label class="block text-zinc-400 mb-1 font-semibold">Avatar Image</label>
                        <input type="file" name="avatar" accept="image/*" class="text-xs text-zinc-400 file:py-1 file:px-2 file:rounded-lg file:border-0 file:bg-zinc-800 file:text-white" />
                    </div>
                    <div>
                        <label class="block text-zinc-400 mb-1 font-semibold">Banner Image</label>
                        <input type="file" name="banner" accept="image/*" class="text-xs text-zinc-400 file:py-1 file:px-2 file:rounded-lg file:border-0 file:bg-zinc-800 file:text-white" />
                    </div>
                </div>

                <div class="pt-3 border-t border-zinc-800 flex justify-end space-x-2">
                    <button type="button" onclick="document.getElementById('edit-profile-modal').classList.add('hidden')" class="px-3.5 py-1.5 rounded-xl text-xs text-zinc-400 hover:text-white transition">Cancel</button>
                    <button type="submit" class="bg-white hover:bg-zinc-200 text-black font-bold px-4 py-1.5 rounded-xl text-xs transition active:scale-95 shadow-sm">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
