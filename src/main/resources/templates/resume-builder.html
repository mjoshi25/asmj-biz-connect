<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Creator / Nexus</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link rel="stylesheet" th:href="@{/css/animations.css}" />
    <script th:src="@{/js/app.js}"></script>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body class="bg-[#08080c] text-zinc-100 min-h-screen antialiased">
    <div class="max-w-[1320px] mx-auto flex justify-center min-h-screen">
        
        <div th:replace="~{fragments/navigation :: left-nav(activeTab='resume')}"></div>

        <main class="w-full max-w-[860px] flex-1 border-r border-zinc-800/80 min-h-screen pb-16 bg-zinc-950/30">
            <!-- Header -->
            <div class="sticky top-0 bg-[#08080c]/85 backdrop-blur-md border-b border-zinc-800/80 px-5 py-3.5 flex justify-between items-center z-20">
                <div>
                    <h1 class="text-lg font-bold text-white leading-none">Resume Creator</h1>
                    <span class="text-[11px] text-zinc-500">Excel & Photo to PDF Generator</span>
                </div>
                
                <a th:href="@{/resume/template/download}" 
                   class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 border border-zinc-700 px-3.5 py-1.5 rounded-full text-xs font-semibold flex items-center space-x-1.5 transition">
                    <svg class="w-3.5 h-3.5 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    <span>Download Excel Template</span>
                </a>
            </div>

            <div class="p-6 space-y-6">
                
                <!-- Upload Dropzone -->
                <div class="bg-zinc-900/40 border border-zinc-800 rounded-3xl p-6 space-y-5">
                    <form hx-post="/resume/upload" 
                          hx-encoding="multipart/form-data" 
                          hx-target="#resume-preview-area"
                          hx-indicator="#upload-spinner"
                          class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        
                        <!-- 1. Excel File -->
                        <div class="bg-zinc-950/60 p-4 rounded-2xl border border-zinc-800 space-y-2">
                            <label class="block text-xs font-bold text-zinc-200">
                                1. Excel Details (.xlsx) <span class="text-rose-400">*</span>
                            </label>
                            <input type="file" name="file" accept=".xlsx, .xls" required 
                                   class="w-full text-xs text-zinc-400 file:mr-2 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-zinc-800 file:text-white hover:file:bg-zinc-700 cursor-pointer" />
                        </div>

                        <!-- 2. Passport Photo -->
                        <div class="bg-zinc-950/60 p-4 rounded-2xl border border-zinc-800 space-y-2">
                            <label class="block text-xs font-bold text-zinc-200">
                                2. Passport Photo (Optional)
                            </label>
                            <input type="file" name="photo" accept="image/png, image/jpeg, image/jpg" 
                                   class="w-full text-xs text-zinc-400 file:mr-2 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-zinc-800 file:text-white hover:file:bg-zinc-700 cursor-pointer" />
                        </div>

                        <!-- Submit Button -->
                        <div class="md:col-span-2 flex justify-center pt-2">
                            <button type="submit" 
                                    class="bg-gradient-to-r from-sky-500 via-indigo-500 to-purple-600 hover:opacity-90 text-white font-semibold px-8 py-2.5 rounded-xl text-xs transition shadow-md shadow-indigo-500/20 active:scale-95">
                                Parse, Attach Photo & Preview
                            </button>
                        </div>
                    </form>

                    <div id="upload-spinner" class="htmx-indicator text-indigo-400 text-xs flex items-center justify-center space-x-2">
                        <svg class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>
                        <span>Processing documents and rendering preview...</span>
                    </div>
                </div>

                <!-- Template Selector & Live Preview Area -->
                <div id="resume-preview-area">
                    <div class="p-16 text-center text-zinc-500 text-xs border border-dashed border-zinc-800 rounded-2xl">
                        Upload your Excel workbook and passport photo to preview your resume.
                    </div>
                </div>
            </div>
        </main>

        <div th:replace="~{fragments/sidebar :: right-sidebar}"></div>
    </div>
</body>
</html>
